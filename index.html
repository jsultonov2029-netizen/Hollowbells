<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hollowbell</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #07060f;
    color: #e6e4f0;
    font-family: 'Courier New', Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #stage-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    flex: 1;
    min-height: 0;
    padding: 8px;
  }
  canvas {
    background: #000;
    border: 3px solid #2a2648;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 18px rgba(200, 160, 60, 0.15);
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 4 / 3;
    display: block;
  }
  #toolbar {
    display: flex;
    gap: 10px;
    padding: 6px 12px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: #8c88a8;
  }
  .btn {
    background: #161428;
    color: #dcd8f0;
    border: 1px solid #3c3664;
    border-radius: 6px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: #23203e; border-color: #c8a03c; color: #ffe63c; }
  .btn:active { transform: translateY(1px); }

  /* Mobile / Touch Pad */
  #touch-controls {
    display: none;
    width: 100%;
    max-width: 640px;
    padding: 6px 14px 12px;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  @media (pointer: coarse), (max-width: 720px) {
    #touch-controls { display: flex; }
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
  }
  .tbtn {
    background: rgba(28, 24, 56, 0.85);
    border: 2px solid #4a437a;
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-weight: bold;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .tbtn:active, .tbtn.pressed {
    background: #c8a03c;
    color: #000;
    border-color: #ffe63c;
  }
  .act-pad {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .act-pad .tbtn {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    font-size: 16px;
  }
  .tbtn-c { border-color: #466eff; }
  .tbtn-x { border-color: #ff8c00; }
  .tbtn-z { border-color: #ffe63c; width: 62px !important; height: 62px !important; }
</style>
</head>
<body>

<div id="stage-wrap">
  <canvas id="game" width="640" height="480"></canvas>
</div>

<div id="toolbar">
  <span>Move: Arrows/WASD &bull; Confirm/Jump: Z/Enter/Space &bull; Back/Slow: X/Shift &bull; Menu: C/Tab</span>
  <button class="btn" id="btn-mute">Sound: ON (M)</button>
  <button class="btn" id="btn-fs">Fullscreen (F11)</button>
</div>

<div id="touch-controls">
  <div class="dpad">
    <div></div>
    <button class="tbtn" data-key="ArrowUp">&#9650;</button>
    <div></div>
    <button class="tbtn" data-key="ArrowLeft">&#9664;</button>
    <div></div>
    <button class="tbtn" data-key="ArrowRight">&#9654;</button>
    <div></div>
    <button class="tbtn" data-key="ArrowDown">&#9660;</button>
    <div></div>
  </div>
  <div class="act-pad">
    <button class="tbtn tbtn-c" data-key="KeyC">C</button>
    <button class="tbtn tbtn-x" data-key="KeyX">X</button>
    <button class="tbtn tbtn-z" data-key="KeyZ">Z</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =========================================================================
  // CONSTANTS & COLORS
  // =========================================================================
  const W = 640, H = 480;
  const TILE = 32;
  const COLS = W / TILE, ROWS = H / TILE;

  const BLACK  = "#000000";
  const WHITE  = "#ffffff";
  const YELLOW = "#ffe63c";
  const ORANGE = "#ff8c00";
  const RED    = "#ff0000";
  const BLUE   = "#466eff";
  const GREEN  = "#3cdc5a";
  const GREY   = "#6e6e6e";
  const NIGHT  = "#0c0a1e";
  const MOON   = "#e6e6c8";
  const RIDGE  = "#1c1838";
  const BELL   = "#c8a03c";

  const rgb = (r, g, b, a = 1) => a < 1 ? `rgba(${r|0},${g|0},${b|0},${a})` : `rgb(${r|0},${g|0},${b|0})`;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const randRange = (a, b) => a + Math.random() * (b - a);
  const randChoice = (arr) => arr[(Math.random() * arr.length) | 0];
  const rectOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const rectContains = (r, px, py) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  const rectInflate = (r, dw, dh) => ({ x: r.x - dw / 2, y: r.y - dh / 2, w: r.w + dw, h: r.h + dh });

  // =========================================================================
  // KEYBOARD & INPUT STATE
  // =========================================================================
  const keysDown = new Set();
  const CONFIRM_CODES = new Set(["KeyZ", "Enter", "Space", "NumpadEnter"]);
  const SKIP_CODES    = new Set(["KeyX", "ShiftLeft", "ShiftRight"]);
  const BACK_CODES    = new Set(["KeyX", "ShiftLeft", "ShiftRight", "Backspace"]);
  const PAUSE_CODES   = new Set(["KeyC", "Tab"]);
  const LEFT_CODES    = new Set(["ArrowLeft", "KeyA"]);
  const RIGHT_CODES   = new Set(["ArrowRight", "KeyD"]);
  const UP_CODES      = new Set(["ArrowUp", "KeyW"]);
  const DOWN_CODES    = new Set(["ArrowDown", "KeyS"]);

  const isHeld = (codes) => {
    for (const c of codes) if (keysDown.has(c)) return true;
    return false;
  };

  // =========================================================================
  // FONT & TEXT HELPERS
  // =========================================================================
  const FONT_FAMILY = "'Courier New', Consolas, 'DejaVu Sans Mono', monospace";
  const setFont = (ctx, size, bold = true) => {
    ctx.font = `${bold ? "bold " : ""}${size}px ${FONT_FAMILY}`;
    ctx.textBaseline = "top";
  };

  const measureTextW = (ctx, text, size) => {
    setFont(ctx, size);
    return ctx.measureText(text).width;
  };

  function wrapText(ctx, text, size, width) {
    setFont(ctx, size);
    const lines = [];
    for (const paragraph of text.split("\n")) {
      let cur = "";
      for (const word of paragraph.split(" ")) {
        const test = cur ? cur + " " + word : word;
        if (ctx.measureText(test).width <= width) {
          cur = test;
        } else {
          if (cur) lines.push(cur);
          cur = word;
        }
      }
      lines.push(cur);
    }
    return lines;
  }

  function paginateText(ctx, text, size, width, maxLines) {
    const lines = wrapText(ctx, text, size, width);
    const pages = [];
    for (let i = 0; i < lines.length; i += maxLines) {
      pages.push(lines.slice(i, i + maxLines).join("\n"));
    }
    return pages.length ? pages : [""];
  }

  function drawTyped(ctx, size, text, shown, x, y, lh, color = WHITE) {
    setFont(ctx, size);
    ctx.fillStyle = color;
    let remaining = shown;
    for (const line of text.split("\n")) {
      const part = line.slice(0, Math.max(0, remaining));
      remaining -= line.length + 1;
      if (part) ctx.fillText(part, x, y);
      y += lh;
    }
  }

  function drawCenteredText(ctx, text, size, cx, cy, color = WHITE, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    setFont(ctx, size);
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }

  class Typewriter {
    constructor(text, speed = 30, voice = null) {
      this.text = text;
      this.speed = speed;
      this.timer = 0.0;
      this.voice = voice;
      this._last = 0;
    }
    get shown() {
      return Math.min(this.text.length, Math.floor(this.timer * this.speed));
    }
    get done() {
      return this.shown >= this.text.length;
    }
    update(dt) {
      this.timer += dt;
      const n = this.shown;
      if (this.voice && n > this._last && AUDIO) {
        const ch = this.text[n - 1];
        if (ch !== " " && ch !== "\n" && n % 2 === 0) {
          AUDIO.sfx(this.voice);
        }
      }
      this._last = n;
    }
    finish() {
      this.timer = this.text.length / this.speed;
      this._last = this.text.length;
    }
  }

  // =========================================================================
  // UI DRAWING PRIMITIVES
  // =========================================================================
  function drawPanel(ctx, r, border = WHITE) {
    ctx.fillStyle = BLACK;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = border;
    ctx.lineWidth = 4;
    ctx.strokeRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
  }

  function drawHeart(ctx, x, y, size = 8, color = RED) {
    const r = size * 0.55;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x - size * 0.5, y - size * 0.3, r, 0, Math.PI * 2);
    ctx.arc(x + size * 0.5, y - size * 0.3, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - size * 1.03, y - size * 0.05);
    ctx.lineTo(x + size * 1.03, y - size * 0.05);
    ctx.lineTo(x, y + size * 1.0);
    ctx.closePath();
    ctx.fill();
  }

  function drawMenuList(ctx, size, labels, sub, x, y, lh, rows = 3) {
    let start = 0;
    if (labels.length > rows) {
      start = Math.min(Math.max(0, sub - rows + 1), labels.length - rows);
    }
    setFont(ctx, size);
    ctx.fillStyle = WHITE;
    const slice = labels.slice(start, start + rows);
    slice.forEach((label, n) => {
      ctx.fillText("* " + label, x, y + n * lh);
    });
    drawHeart(ctx, x - 20, y + (sub - start) * lh + 10, 7);
    ctx.fillStyle = GREY;
    if (start > 0) {
      ctx.beginPath();
      ctx.moveTo(x + 440, y + 6);
      ctx.lineTo(x + 450, y + 6);
      ctx.lineTo(x + 445, y - 2);
      ctx.closePath();
      ctx.fill();
    }
    if (start + rows < labels.length) {
      ctx.beginPath();
      ctx.moveTo(x + 440, y + rows * lh - 8);
      ctx.lineTo(x + 450, y + rows * lh - 8);
      ctx.lineTo(x + 445, y + rows * lh);
      ctx.closePath();
      ctx.fill();
    }
  }

  // =========================================================================
  // PROCEDURAL WEB AUDIO SYNTHESIZER (16 SFX + 10 LOOPING CHIPTUNE TRACKS)
  // =========================================================================
  const hz = (midi) => 440.0 * Math.pow(2, (midi - 69) / 12);

  const TRACKS = {
    title:  [[69, 0, 72, 0, 76, 0, 72, 0, 67, 0, 71, 0, 74, 0, 71, 0],
             [45, 45, 43, 43, 41, 41, 43, 43], 0.32, "triangle", 0.20],
    cave:   [[57, 0, 60, 0, 64, 0, 60, 0, 55, 0, 59, 0, 62, 0, 59, 0],
             [33, 33, 31, 31, 29, 29, 31, 31], 0.45, "triangle", 0.22],
    battle: [[76, 0, 76, 72, 0, 72, 69, 72, 74, 0, 74, 71, 0, 71, 67, 71,
              76, 76, 0, 79, 76, 0, 72, 69, 71, 72, 74, 76, 74, 72, 71, 0],
             [45, 45, 41, 41, 43, 43, 40, 40, 45, 45, 41, 41, 43, 43, 47, 47],
             0.14, "square", 0.12],
    boss:   [[64, 64, 0, 64, 63, 0, 64, 67, 0, 64, 64, 0, 62, 0, 60, 59,
              64, 64, 0, 64, 66, 0, 67, 71, 0, 69, 67, 0, 66, 0, 64, 0],
             [40, 40, 40, 40, 38, 38, 38, 38, 36, 36, 36, 36, 35, 35, 35, 35],
             0.12, "square", 0.12],
    shop:   [[72, 76, 79, 76, 72, 76, 79, 84, 71, 74, 79, 74, 71, 74, 79, 83],
             [48, 48, 43, 43, 47, 47, 43, 43], 0.22, "square", 0.10],
    ending: [[72, 0, 76, 79, 0, 76, 72, 0, 69, 0, 72, 76, 0, 72, 69, 0],
             [48, 48, 45, 45, 41, 41, 43, 43], 0.40, "triangle", 0.22],
    roots:  [[62, 0, 65, 0, 69, 0, 65, 0, 60, 0, 64, 0, 67, 0, 64, 0],
             [38, 38, 36, 36, 34, 34, 36, 36], 0.40, "triangle", 0.22],
    quiet:  [[60, 0, 0, 64, 0, 0, 67, 0, 65, 0, 0, 62, 0, 0, 59, 0],
             [36, 36, 31, 31, 33, 33, 31, 31], 0.50, "triangle", 0.20],
    forge:  [[57, 0, 57, 60, 0, 57, 0, 55, 57, 0, 57, 62, 0, 60, 0, 57,
              55, 0, 55, 58, 0, 55, 0, 53, 55, 0, 55, 60, 0, 58, 0, 55],
             [33, 33, 33, 33, 31, 31, 31, 31, 29, 29, 29, 29, 31, 31, 31, 31],
             0.18, "square", 0.11],
    heart:  [[69, 0, 72, 69, 0, 72, 76, 0, 74, 72, 0, 69, 67, 0, 69, 0,
              69, 0, 72, 69, 0, 72, 77, 0, 76, 74, 0, 72, 71, 0, 69, 0],
             [45, 45, 45, 45, 43, 43, 43, 43, 41, 41, 41, 41, 40, 40, 43, 43],
             0.11, "square", 0.12],
  };

  class AudioEngine {
    constructor() {
      this.ctx = null;
      this.masterGain = null;
      this.musicGain = null;
      this.sfxGain = null;
      this.noiseBuffer = null;
      this.currentTrack = null;
      this.stepIndex = 0;
      this.stepTimer = 0;
      this.muted = false;
    }

    unlock() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = this.muted ? 0 : 0.7;
        this.masterGain.connect(this.ctx.destination);

        this.musicGain = this.ctx.createGain();
        this.musicGain.gain.value = 0.5;
        this.musicGain.connect(this.masterGain);

        this.sfxGain = this.ctx.createGain();
        this.sfxGain.gain.value = 0.65;
        this.sfxGain.connect(this.masterGain);

        // Prebuild white noise buffer
        const sr = this.ctx.sampleRate;
        this.noiseBuffer = this.ctx.createBuffer(1, sr * 1.5, sr);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      if (this.ctx && this.ctx.state === "suspended") {
        this.ctx.resume();
      }
    }

    toggleMute() {
      this.muted = !this.muted;
      if (this.masterGain && this.ctx) {
        this.masterGain.gain.setValueAtTime(this.muted ? 0 : 0.7, this.ctx.currentTime);
      }
      const btn = document.getElementById("btn-mute");
      if (btn) btn.textContent = `Sound: ${this.muted ? "OFF" : "ON"} (M)`;
    }

    _tone(freq, dur, vol = 0.25, type = "square", decay = 1.0, delay = 0, dest = null) {
      if (!this.ctx || this.muted || freq <= 0) return;
      const now = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type === "tri" ? "triangle" : type;
      osc.frequency.setValueAtTime(freq, now);

      const endVol = Math.max(0.0001, vol * (1 - decay * 0.92));
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.003);
      gain.gain.exponentialRampToValueAtTime(endVol, now + dur);

      osc.connect(gain);
      gain.connect(dest || this.sfxGain);
      osc.start(now);
      osc.stop(now + dur + 0.01);
    }

    _noise(dur, vol = 0.3, delay = 0) {
      if (!this.ctx || this.muted || !this.noiseBuffer) return;
      const now = this.ctx.currentTime + delay;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(gain);
      gain.connect(this.sfxGain);
      src.start(now);
      src.stop(now + dur + 0.01);
    }

    _seq(notes, vol = 0.25, type = "square", decay = 0.5) {
      let t = 0;
      for (const [f, d] of notes) {
        if (f > 0) this._tone(f, d, vol, type, decay, t);
        t += d;
      }
    }

    sfx(name) {
      this.unlock();
      if (!this.ctx || this.muted) return;
      switch (name) {
        case "blip":
          this._tone(520, 0.035, 0.14, "square", 0.6);
          break;
        case "blip_low":
          this._tone(290, 0.04, 0.16, "square", 0.6);
          break;
        case "select":
          this._tone(760, 0.05, 0.18, "square", 0.5);
          break;
        case "confirm":
          this._seq([[660, 0.05], [990, 0.08]], 0.18);
          break;
        case "hit":
          this._noise(0.14, 0.35);
          this._tone(140, 0.14, 0.3, "square", 1.0);
          break;
        case "slash":
          this._noise(0.22, 0.32);
          break;
        case "heal":
          this._seq([[523, 0.06], [659, 0.06], [784, 0.06], [1047, 0.12]], 0.25, "triangle");
          break;
        case "buy":
          this._seq([[880, 0.05], [1320, 0.09]], 0.20);
          break;
        case "alert":
          this._seq([[900, 0.1], [0, 0.03], [900, 0.14]], 0.24);
          break;
        case "door":
          this._noise(0.15, 0.16);
          this._tone(220, 0.2, 0.22, "triangle", 1.0);
          break;
        case "save":
          this._seq([[523, 0.08], [659, 0.08], [784, 0.08], [1047, 0.08], [1319, 0.2]], 0.25, "triangle");
          break;
        case "bell":
          this._tone(523, 1.6, 0.38, "triangle", 1.0);
          this._tone(1047, 1.6, 0.15, "triangle", 1.0);
          break;
        case "break":
          this._seq([[400, 0.1], [300, 0.1], [200, 0.25]], 0.26, "square", 0.8);
          break;
        case "error":
          this._seq([[200, 0.08], [160, 0.12]], 0.22);
          break;
        case "page":
          this._seq([[880, 0.06], [1175, 0.06], [1568, 0.12]], 0.24, "triangle");
          break;
        case "unlock":
          this._seq([[300, 0.08], [450, 0.08], [700, 0.14]], 0.22);
          break;
      }
    }

    playMusic(name) {
      if (name === this.currentTrack) return;
      this.currentTrack = name;
      this.stepIndex = 0;
      this.stepTimer = 0;
    }

    update(dt) {
      if (!this.ctx || this.ctx.state !== "running" || !this.currentTrack || this.muted) return;
      const tr = TRACKS[this.currentTrack];
      if (!tr) return;
      const [melody, bass, step, kind, vol] = tr;
      this.stepTimer -= dt;
      while (this.stepTimer <= 0) {
        const mNote = melody[this.stepIndex % melody.length];
        if (mNote > 0) {
          this._tone(hz(mNote), step * 0.92, vol, kind, 0.6, 0, this.musicGain);
        }
        if (this.stepIndex % 2 === 0) {
          const bNote = bass[(this.stepIndex >> 1) % bass.length];
          if (bNote > 0) {
            this._tone(hz(bNote), step * 1.9, 0.22, "triangle", 0.25, 0, this.musicGain);
          }
        }
        this.stepIndex = (this.stepIndex + 1) % melody.length;
        this.stepTimer += step;
      }
    }
  }

  const AUDIO = new AudioEngine();

  // =========================================================================
  // GAME DATA: ITEMS, EXP, SHOPS
  // =========================================================================
  const EXP_TABLE = [0, 8, 20, 40, 70, 110, 160, 230, 320];
  const INVENTORY_MAX = 8;
  const ITEMS = {
    "Glow Berry":    { type: "heal", amount: 8,  price: 10,  desc: "Faintly glowing fruit. Heals 8 HP." },
    "Honey Biscuit": { type: "heal", amount: 16, price: 28,  desc: "Warm and sweet. Heals 16 HP." },
    "Spore Tea":     { type: "heal", amount: 20, price: 32,  desc: "Earthy and calming. Heals 20 HP." },
    "Ember Bun":     { type: "heal", amount: 24, price: 40,  desc: "Still warm from the forge. Heals 24 HP." },
    "Moonmilk":      { type: "heal", amount: 30, price: 65,  desc: "Cool, silvery milk. Heals 30 HP." },
    "Heartroot Sap": { type: "heal", amount: 45, price: 95,  desc: "Thick, golden, humming. Heals 45 HP." },
    "Twig":          { type: "weapon", atk: 0,   price: 0,   desc: "A plain twig. ATK +0." },
    "Brass Rod":     { type: "weapon", atk: 3,   price: 70,  desc: "A bell-keeper's rod. ATK +3." },
    "Lantern Staff": { type: "weapon", atk: 6,   price: 150, desc: "Glows when swung. ATK +6." },
    "Ink Quill":     { type: "weapon", atk: 5,   price: 110, desc: "Writes sharp little words. ATK +5." },
    "Cinder Blade":  { type: "weapon", atk: 9,   price: 230, desc: "Warm to the touch. ATK +9." },
    "Wool Scarf":    { type: "armor", def: 0,    price: 0,   desc: "Cozy, not protective. DEF +0." },
    "Moth Cloak":    { type: "armor", def: 2,    price: 80,  desc: "Soft grey wool. DEF +2." },
    "Ash Mantle":    { type: "armor", def: 4,    price: 140, desc: "Heavy, heat-proof wool. DEF +4." },
    "Echo Locket":   { type: "armor", def: 5,    price: 0,   desc: "Hums a quiet tune. DEF +5." },
  };

  // =========================================================================
  // PROCEDURAL CHARACTER & SPRITE RENDERERS
  // =========================================================================
  function fillEllipse(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, Math.max(0.5, w / 2), Math.max(0.5, h / 2), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function strokeEllipse(ctx, x, y, w, h, color, lw = 2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, Math.max(0.5, w / 2), Math.max(0.5, h / 2), 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  function fillCircle(ctx, cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0.5, r), 0, Math.PI * 2);
    ctx.fill();
  }

  function strokeCircle(ctx, cx, cy, r, color, lw = 2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0.5, r), 0, Math.PI * 2);
    ctx.stroke();
  }

  function fillPoly(ctx, pts, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  function drawLine(ctx, x1, y1, x2, y2, color, lw = 1) {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawWick(ctx, bx, by, t) {
    fillEllipse(ctx, bx - 14, by - 5, 28, 10, BLACK);
    fillPoly(ctx, [[bx - 13, by], [bx + 13, by], [bx + 8, by - 34], [bx - 8, by - 34]], rgb(160, 95, 70));
    drawLine(ctx, bx - 12, by - 3, bx + 12, by - 3, rgb(210, 160, 90), 2);
    ctx.fillStyle = rgb(140, 80, 60);
    ctx.fillRect(bx - 15, by - 30, 5, 16);
    ctx.fillRect(bx + 10, by - 30, 5, 16);
    fillCircle(ctx, bx + 17, by - 12, 6, rgb(255, 200, 80));
    fillCircle(ctx, bx + 17, by - 12, 3, rgb(255, 255, 210));
    ctx.fillStyle = rgb(240, 230, 200);
    ctx.fillRect(bx - 7, by - 52, 14, 19);
    const flick = Math.sin(t * 10);
    fillEllipse(ctx, bx - 5, by - 69 + flick, 10, 16, rgb(255, 160, 40));
    fillEllipse(ctx, bx - 3, by - 65 + flick, 6, 10, rgb(255, 235, 130));
    ctx.fillStyle = rgb(40, 30, 40);
    ctx.fillRect(bx - 4, by - 45, 2, 3);
    ctx.fillRect(bx + 2, by - 45, 2, 3);
    drawLine(ctx, bx - 3, by - 39, bx + 3, by - 39, rgb(40, 30, 40), 1);
  }

  function drawMothlet(ctx, cx, cy, t, s = 1) {
    const flap = Math.sin(t * 14);
    const ww = Math.max(2, (16 + 5 * flap) * s);
    const wing = rgb(200, 190, 230), wing2 = rgb(232, 226, 246);
    fillEllipse(ctx, cx - ww - 3 * s, cy - 14 * s, ww, 22 * s, wing);
    fillEllipse(ctx, cx + 3 * s, cy - 14 * s, ww, 22 * s, wing);
    fillEllipse(ctx, cx - ww - 1 * s, cy - 9 * s, Math.max(2, ww / 2), 11 * s, wing2);
    fillEllipse(ctx, cx + 5 * s, cy - 9 * s, Math.max(2, ww / 2), 11 * s, wing2);
    fillEllipse(ctx, cx - 5 * s, cy - 8 * s, 10 * s, 22 * s, rgb(150, 130, 170));
    fillCircle(ctx, cx, cy - 12 * s, 6 * s, rgb(175, 155, 195));
    for (const ex of [-2, 2]) {
      fillCircle(ctx, cx + ex * s, cy - 12 * s, Math.max(1, 1.3 * s), rgb(20, 10, 30));
    }
    const w = Math.max(1, s);
    drawLine(ctx, cx - 2 * s, cy - 17 * s, cx - 7 * s, cy - 26 * s, wing, w);
    drawLine(ctx, cx + 2 * s, cy - 17 * s, cx + 7 * s, cy - 26 * s, wing, w);
  }

  function drawGloomcap(ctx, cx, cy, t, s = 1) {
    const bob = Math.sin(t * 3) * 1.5 * s;
    ctx.fillStyle = rgb(230, 220, 190);
    ctx.fillRect(cx - 7 * s, cy - 2 * s + bob, 14 * s, 16 * s);
    fillEllipse(ctx, cx - 17 * s, cy - 20 * s + bob, 34 * s, 24 * s, rgb(110, 60, 140));
    for (const [sx, sy, sr] of [[-8, -12, 3], [6, -14, 2.5], [10, -8, 2]]) {
      fillCircle(ctx, cx + sx * s, cy + sy * s + bob, Math.max(1, sr * s), rgb(220, 190, 240));
    }
    for (const ex of [-3, 3]) {
      fillCircle(ctx, cx + ex * s, cy + 5 * s + bob, Math.max(1, 1.4 * s), rgb(40, 30, 50));
    }
    drawLine(ctx, cx - 2 * s, cy + 10 * s + bob, cx + 2 * s, cy + 10 * s + bob, rgb(40, 30, 50), Math.max(1, s * 0.8));
  }

  function drawWisp(ctx, cx, cy, t, s = 1) {
    const f = Math.sin(t * 9);
    const body = rgb(70, 110, 190);
    fillEllipse(ctx, cx - 11 * s, cy - 16 * s, 22 * s, 32 * s, body);
    fillPoly(ctx, [[cx - 8 * s, cy - 10 * s], [cx + 8 * s, cy - 10 * s], [cx + f * 3 * s, cy - (26 + 4 * f) * s]], body);
    fillEllipse(ctx, cx - 7 * s, cy - 10 * s, 14 * s, 22 * s, rgb(150, 200, 255));
    fillEllipse(ctx, cx - 3 * s, cy - 4 * s, 6 * s, 12 * s, rgb(225, 245, 255));
    for (const ex of [-3, 3]) {
      fillCircle(ctx, cx + ex * s, cy - 2 * s, Math.max(1, 1.4 * s), rgb(20, 30, 70));
    }
    const w = Math.max(1, s);
    for (const dx of [-6, 0, 6]) {
      drawLine(ctx, cx + dx * s, cy + 14 * s, cx + (dx + f * 3) * s, cy + 22 * s, rgb(110, 160, 230), w);
    }
  }

  function drawHush(ctx, cx, cy, t, s = 1) {
    const P = (dx, dy) => [cx + dx * s, cy + dy * s];
    const body = rgb(46, 74, 86), brass = BELL;
    strokeCircle(ctx, ...P(0, -40), Math.max(2, 6 * s), brass, Math.max(1, 2 * s));
    fillEllipse(ctx, ...P(-22, -36), 44 * s, 44 * s, body);
    fillPoly(ctx, [P(-21, -14), P(21, -14), P(32, 16), P(-32, 16)], body);
    fillEllipse(ctx, ...P(-33, 10), 66 * s, 13 * s, brass);
    fillCircle(ctx, ...P(Math.sin(t * 2) * 7, 24), Math.max(2, 7 * s), brass);
    for (const ex of [-12, 4]) {
      fillEllipse(ctx, ...P(ex, -18), 8 * s, 11 * s, rgb(170, 255, 235));
    }
    const dark = rgb(20, 30, 40);
    const lw = Math.max(1, s);
    drawLine(ctx, ...P(-8, -2), ...P(8, -2), dark, Math.max(1, 2 * s));
    drawLine(ctx, ...P(-4, -34), ...P(2, -24), dark, lw);
    drawLine(ctx, ...P(2, -24), ...P(-2, -16), dark, lw);
  }

  function drawBell(ctx, cx, cy, s = 1.0, rCol = 200, gCol = 160, bCol = 60) {
    const P = (dx, dy) => [cx + dx * s, cy + dy * s];
    const col = rgb(rCol, gCol, bCol);
    const dark = rgb(Math.max(0, rCol - 40), Math.max(0, gCol - 40), Math.max(0, bCol - 40));
    strokeCircle(ctx, ...P(0, -34), Math.max(2, 5 * s), col, Math.max(1, 2 * s));
    fillEllipse(ctx, ...P(-20, -30), 40 * s, 40 * s, col);
    fillPoly(ctx, [P(-19, -10), P(19, -10), P(30, 16), P(-30, 16)], col);
    fillEllipse(ctx, ...P(-31, 12), 62 * s, 12 * s, dark);
    fillCircle(ctx, ...P(0, 24), Math.max(2, 6 * s), dark);
  }

  function drawMossback(ctx, bx, by, t) {
    fillEllipse(ctx, bx - 28, by - 5, 56, 10, BLACK);
    fillEllipse(ctx, bx - 24, by - 32, 44, 30, rgb(80, 120, 70));
    for (const [dx, dy] of [[-12, -22], [0, -26], [10, -20], [-4, -14]]) {
      fillCircle(ctx, bx + dx, by + dy, 4, rgb(120, 170, 90));
    }
    fillCircle(ctx, bx - 2, by - 34, 4, BELL);
    const nod = Math.sin(t * 2) * 1.5;
    fillEllipse(ctx, bx + 10, by - 20 + nod, 22, 18, rgb(120, 160, 100));
    fillCircle(ctx, bx + 24, by - 14 + nod, 2, rgb(20, 30, 20));
    ctx.fillStyle = rgb(100, 140, 90);
    ctx.fillRect(bx - 16, by - 6, 7, 6);
    ctx.fillRect(bx + 4, by - 6, 7, 6);
  }

  function drawBramble(ctx, bx, by, t) {
    const sway = Math.sin(t * 1.5) * 2;
    fillEllipse(ctx, bx - 14, by - 5, 28, 10, BLACK);
    fillPoly(ctx, [[bx - 9, by], [bx + 9, by], [bx + 5 + sway, by - 40], [bx - 5 + sway, by - 40]], rgb(60, 130, 70));
    fillPoly(ctx, [[bx, by - 18], [bx + 20, by - 30], [bx + 6, by - 12]], rgb(80, 160, 90));
    fillPoly(ctx, [[bx, by - 24], [bx - 20, by - 36], [bx - 6, by - 16]], rgb(80, 160, 90));
    for (let i = 0; i < 6; i++) {
      const ang = i * Math.PI / 3 + t * 0.5;
      fillCircle(ctx, bx + sway + Math.cos(ang) * 9, by - 50 + Math.sin(ang) * 9, 6, rgb(240, 120, 160));
    }
    fillCircle(ctx, bx + sway, by - 50, 6, rgb(255, 220, 120));
    ctx.fillStyle = rgb(40, 30, 40);
    ctx.fillRect(bx + sway - 3, by - 52, 2, 3);
    ctx.fillRect(bx + sway + 1, by - 52, 2, 3);
  }

  function drawQuillby(ctx, bx, by, t) {
    fillEllipse(ctx, bx - 16, by - 5, 32, 10, BLACK);
    fillEllipse(ctx, bx - 14, by - 32, 28, 30, rgb(50, 50, 90));
    fillEllipse(ctx, bx - 8, by - 24, 16, 18, rgb(90, 90, 150));

    fillPoly(ctx, [[bx + 6, by - 37], [bx + 17, by - 34], [bx + 6, by - 31]], rgb(240, 190, 70));
    fillCircle(ctx, bx + 2, by - 38, 3, WHITE);
    fillCircle(ctx, bx + 3, by - 38, 1, BLACK);
    const tip = [bx - 11, by - 62 + Math.sin(t * 3) * 2];
    drawLine(ctx, bx - 4, by - 46, tip[0], tip[1], rgb(230, 230, 240), 3);
    fillPoly(ctx, [tip, [tip[0] - 4, tip[1] + 10], [tip[0] + 4, tip[1] + 8]], rgb(230, 230, 240));
    ctx.fillStyle = rgb(240, 190, 70);
    ctx.fillRect(bx - 7, by - 4, 3, 4);
    ctx.fillRect(bx + 4, by - 4, 3, 4);
  }

  function drawCinder(ctx, bx, by, t) {
    fillEllipse(ctx, bx - 18, by - 5, 36, 10, BLACK);
    ctx.fillStyle = rgb(70, 60, 66);
    ctx.fillRect(bx - 12, by - 32, 24, 28);
    ctx.fillStyle = rgb(120, 90, 60);
    ctx.fillRect(bx - 9, by - 24, 18, 20);
    fillCircle(ctx, bx, by - 38, 10, rgb(90, 80, 80));
    const glow = 200 + Math.sin(t * 6) * 40;
    ctx.fillStyle = rgb(255, glow / 2 + 60, 60);
    for (const ex of [-4, 3]) ctx.fillRect(bx + ex, by - 40, 3, 4);
    drawLine(ctx, bx + 12, by - 30, bx + 22, by - 12, rgb(110, 80, 50), 3);
    ctx.fillStyle = rgb(140, 140, 150);
    ctx.fillRect(bx + 16, by - 38, 14, 8);
    if (Math.floor(t * 5) % 3 === 0) fillCircle(ctx, bx + 28, by - 40, 2, rgb(255, 180, 60));

  function drawPip(ctx, x, y, t) {
    const flap = Math.sin(t * 20);
    fillEllipse(ctx, x - 10, y - 8 - flap * 2, 9, 6, rgb(190, 220, 255));
    fillEllipse(ctx, x + 1, y - 8 - flap * 2, 9, 6, rgb(190, 220, 255));
    fillCircle(ctx, x, y, 5, rgb(255, 240, 140));
    fillCircle(ctx, x, y, 2, rgb(255, 255, 220));
    fillCircle(ctx, x, y + 6, 3, rgb(255, 240, 140));
  }

  function drawPage(ctx, x, y, t) {
    const pulse = 14 + Math.sin(t * 4) * 3;
    strokeCircle(ctx, x, y, pulse, rgb(90, 90, 40), 2);
    ctx.fillStyle = rgb(240, 230, 200);
    ctx.fillRect(x - 7, y - 9, 14, 18);
    for (let i = 0; i < 3; i++) {
      drawLine(ctx, x - 4, y - 4 + i * 5, x + 4, y - 4 + i * 5, rgb(120, 100, 80), 1);

  function drawSavepoint(ctx, x, y, t) {
    const pulse = 1 + 0.15 * Math.sin(t * 3);
    const r = 11 * pulse;
    const pts = [];
    for (let i = 0; i < 8; i++) {
      const ang = Math.PI / 4 * i - Math.PI / 2;
      const rad = i % 2 === 0 ? r : r * 0.38;
      pts.push([x + Math.cos(ang) * rad, y + Math.sin(ang) * rad]);
    }
    strokeCircle(ctx, x, y, r + 4, rgb(110, 95, 30), 2);
    fillPoly(ctx, pts, YELLOW);
    fillCircle(ctx, x, y, 3, WHITE);
  }

  function drawChest(ctx, x, y, opened) {
    ctx.fillStyle = rgb(110, 70, 40);
    ctx.fillRect(x - 12, y - 6, 24, 15);
    ctx.strokeStyle = BELL;
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 12, y - 6, 24, 15);
    if (opened) {
      fillPoly(ctx, [[x - 12, y - 6], [x + 12, y - 6], [x + 10, y - 16], [x - 10, y - 16]], rgb(90, 55, 30));
    } else {
      ctx.fillStyle = rgb(90, 55, 30);
      ctx.fillRect(x - 13, y - 12, 26, 7);
      ctx.fillStyle = BELL;
      ctx.fillRect(x - 3, y - 8, 6, 6);
    }

  function drawSign(ctx, x, y) {
    ctx.fillStyle = rgb(90, 60, 40);
    ctx.fillRect(x - 2, y - 2, 4, 11);
    ctx.fillStyle = rgb(170, 130, 80);
    ctx.fillRect(x - 11, y - 15, 22, 13);
    drawLine(ctx, x - 7, y - 11, x + 7, y - 11, rgb(90, 60, 40), 1);
    drawLine(ctx, x - 7, y - 7, x + 3, y - 7, rgb(90, 60, 40), 1);
  }

  function drawRootling(ctx, cx, cy, t, s = 1) {
    const sway = Math.sin(t * 3) * 3;
    fillEllipse(ctx, cx - 11 * s, cy - 10 * s, 22 * s, 26 * s, rgb(110, 70, 40));
    for (const dx of [-8, 0, 8]) {
      drawLine(ctx, cx + dx * s, cy + 14 * s, cx + (dx + sway * 0.5) * s, cy + 22 * s, rgb(90, 55, 30), Math.max(1, 2 * s));
    }
    const stem = [cx + sway * s * 0.5, cy - 16 * s];
    drawLine(ctx, cx, cy - 8 * s, stem[0], stem[1], rgb(70, 140, 60), Math.max(1, 2 * s));
    fillEllipse(ctx, stem[0] - 18 * s, stem[1] - 8 * s, 18 * s, 10 * s, rgb(80, 190, 90));
    fillEllipse(ctx, stem[0], stem[1] - 8 * s, 18 * s, 10 * s, rgb(80, 190, 90));
    for (const ex of [-4, 4]) {
      fillCircle(ctx, cx + ex * s, cy - 1 * s, Math.max(2, 3 * s), rgb(255, 240, 200));
      fillCircle(ctx, cx + ex * s, cy - 1 * s, Math.max(1, 1.2 * s), rgb(30, 20, 10));
    }
  }

  function drawInkblot(ctx, cx, cy, t, s = 1) {
    const wob = Math.sin(t * 4);
    const ink = rgb(24, 22, 52);
    fillEllipse(ctx, cx - (16 + wob) * s, cy - 12 * s, (32 + wob * 2) * s, 26 * s, ink);
    fillEllipse(ctx, cx - 10 * s, cy - 20 * s, 20 * s, 16 * s, ink);
    fillEllipse(ctx, cx - 9 * s, cy - 12 * s, 8 * s, 5 * s, rgb(90, 90, 170));
    for (const dx of [-10, 0, 9]) {
      const drip = (6 + (Math.sin(t * 3 + dx) + 1) * 4) * s;
      drawLine(ctx, cx + dx * s, cy + 10 * s, cx + dx * s, cy + 10 * s + drip, ink, Math.max(1, 3 * s));
    }
    for (const ex of [-5, 5]) {
      fillCircle(ctx, cx + ex * s, cy - 3 * s, Math.max(2, 4 * s), WHITE);
      fillCircle(ctx, cx + (ex + wob) * s * 0.5, cy - 3 * s, Math.max(1, 1.8 * s), BLACK);
    }
  }

  function drawCinderling(ctx, cx, cy, t, s = 1) {
    const f = Math.sin(t * 11);
    fillPoly(ctx, [[cx - 9 * s, cy - 8 * s], [cx + 9 * s, cy - 8 * s], [cx + f * 4 * s, cy - (28 + 4 * f) * s]], rgb(255, 120, 40));
    fillEllipse(ctx, cx - 13 * s, cy - 12 * s, 26 * s, 30 * s, rgb(210, 70, 30));
    fillEllipse(ctx, cx - 8 * s, cy - 5 * s, 16 * s, 20 * s, rgb(255, 170, 60));
    fillPoly(ctx, [[cx - 12 * s, cy - 8 * s], [cx - 8 * s, cy - 18 * s], [cx - 5 * s, cy - 9 * s]], rgb(90, 30, 20));
    fillPoly(ctx, [[cx + 12 * s, cy - 8 * s], [cx + 8 * s, cy - 18 * s], [cx + 5 * s, cy - 9 * s]], rgb(90, 30, 20));
    for (const ex of [-4, 4]) {
      fillCircle(ctx, cx + ex * s, cy + 1 * s, Math.max(1, 2 * s), rgb(255, 255, 160));
    }
    drawLine(ctx, cx - 3 * s, cy + 8 * s, cx + 3 * s, cy + 8 * s, rgb(90, 30, 20), Math.max(1, s));
  }

  function drawClinker(ctx, cx, cy, t, s = 1) {
    const body = rgb(58, 54, 60);
    const glow = rgb(255, 120 + Math.sin(t * 5) * 30, 40);
    ctx.fillStyle = body;
    ctx.fillRect(cx - 18 * s, cy - 14 * s, 36 * s, 34 * s);
    ctx.fillRect(cx - 12 * s, cy - 30 * s, 24 * s, 18 * s);
    ctx.fillRect(cx - 30 * s, cy - 12 * s, 10 * s, 26 * s);
    ctx.fillRect(cx + 20 * s, cy - 12 * s, 10 * s, 26 * s);
    const lw = Math.max(1, 2 * s);
    drawLine(ctx, cx - 18 * s, cy + 2 * s, cx + 18 * s, cy + 2 * s, glow, lw);
    drawLine(ctx, cx, cy - 14 * s, cx, cy + 20 * s, glow, lw);
    ctx.fillStyle = glow;
    ctx.fillRect(cx - 8 * s, cy - 24 * s, 5 * s, 5 * s);
    ctx.fillRect(cx + 3 * s, cy - 24 * s, 5 * s, 5 * s);
    ctx.fillStyle = rgb(90, 90, 100);
    ctx.fillRect(cx + 24 * s, cy + 10 * s, 16 * s, 8 * s);
  }

  function drawHeartroot(ctx, cx, cy, t, s = 1) {
    const beat = 1 + 0.06 * Math.sin(t * 4);
    const S = s * beat;
    const core = rgb(200, 40, 85), glow = rgb(255, 150, 190);
    for (let i = 0; i < 7; i++) {
      const x = cx - 36 * S + i * 12 * S;
      const sway = Math.sin(t * 2 + i) * 6 * S;
      drawLine(ctx, x, cy + 20 * S, x + sway, cy + 52 * S, rgb(60, 120, 60), Math.max(2, 3 * S));
    }
    fillCircle(ctx, cx - 15 * S, cy - 14 * S, 18 * S, core);
    fillCircle(ctx, cx + 15 * S, cy - 14 * S, 18 * S, core);
    fillPoly(ctx, [[cx - 32 * S, cy - 8 * S], [cx + 32 * S, cy - 8 * S], [cx, cy + 36 * S]], core);
    fillCircle(ctx, cx, cy - 4 * S, 10 * S, glow);
    fillCircle(ctx, cx, cy - 4 * S, 4 * S, WHITE);
    for (const dx of [-18, 18]) {
      drawLine(ctx, cx + dx * S, cy - 28 * S, cx + dx * S * 0.4, cy + 10 * S, rgb(60, 140, 70), Math.max(1, 2 * S));
    }
    for (const ex of [-9, 9]) {
      fillEllipse(ctx, cx + ex * S - 3 * S, cy + 8 * S, 6 * S, 8 * S, rgb(40, 10, 30));
    }
  }

  function drawRootsDecor(ctx, t, color, count = 12) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    for (let i = 0; i < count; i++) {
      const x = (i * W / count) + 20;
      ctx.beginPath();
      for (let k = 0; k < 12; k++) {
        const px = x + Math.sin(t * 0.8 + i + k * 0.5) * 14 + k * ((i % 3) - 1) * 3;
        const py = H - k * 26;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
  }

  // =========================================================================
  // MAP & ROOM DATA (ALL 13 ROOMS)
  // =========================================================================
  function makeMap(blocks = [], doors = {}) {
    const grid = Array.from({ length: ROWS }, () => Array(COLS).fill("."));
    for (let x = 0; x < COLS; x++) grid[0][x] = grid[ROWS - 1][x] = "#";
    for (let y = 0; y < ROWS; y++) grid[y][0] = grid[y][COLS - 1] = "#";
    for (const [bx, by, bw, bh] of blocks) {
      for (let y = by; y < by + bh; y++) {
        for (let x = bx; x < bx + bw; x++) {
          grid[y][x] = "#";
        }
      }
    }
    for (const [coord, ch] of Object.entries(doors)) {
      const [dx, dy] = coord.split(",").map(Number);
      grid[dy][dx] = ch;
    }
    return grid.map(r => r.join(""));
  }

  class Room {
    constructor(key) {
      const data = ROOM_DATA[key];
      this.key = key;
      this.name = data.name;
      this.chapter = data.chapter;
      this.spawn = data.spawn;
      this.music = data.music;
      this.lights = data.lights;
      this.fx = data.fx || null;
      const rows = data.map;
      this.solids = [];
      this.doors = {};
      rows.forEach((row, ty) => {
        for (let tx = 0; tx < row.length; tx++) {
          const ch = row[tx];
          if (ch === "#") {
            this.solids.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: TILE });
          } else if (ch >= "0" && ch <= "9") {
            this.doors[`${tx},${ty}`] = data.doors[ch];
          }
        }
      });
      this.surface = this._render(data, rows);
    }

    _render(data, rows) {
      const off = document.createElement("canvas");
      off.width = W;
      off.height = H;
      const c = off.getContext("2d");
      const floorA = rgb(...data.floor[0]);
      const floorB = rgb(...data.floor[1]);
      const wall = rgb(...data.wall);
      const brick = rgb(...data.wall.map(v => Math.min(255, v + 14)));
      rows.forEach((row, ty) => {
        for (let tx = 0; tx < row.length; tx++) {
          const ch = row[tx];
          const rx = tx * TILE, ry = ty * TILE;
          if (ch === "#") {
            c.fillStyle = wall;
            c.fillRect(rx, ry, TILE, TILE);
            drawLine(c, rx, ry + TILE / 2, rx + TILE, ry + TILE / 2, brick, 2);
            const offset = (ty % 2) ? 8 : 22;
            drawLine(c, rx + offset, ry, rx + offset, ry + TILE / 2, brick, 2);
          } else if (ch >= "0" && ch <= "9") {
            c.fillStyle = BLACK;
            c.fillRect(rx, ry, TILE, TILE);
            c.strokeStyle = BELL;
            c.lineWidth = 2;
            c.strokeRect(rx + 1, ry + 1, TILE - 2, TILE - 2);
          } else {
            c.fillStyle = (tx + ty) % 2 === 0 ? floorA : floorB;
            c.fillRect(rx, ry, TILE, TILE);
          }
        }
      });
      return off;
    }
  }

  // =========================================================================
  // PLAYER
  // =========================================================================
  class Player {
    constructor(tile) {
      this.HB_W = 20;
      this.HB_H = 14;
      this.SPEED = 130;
      this.place(tile);
      this.facing = "down";
      this.walking = false;
      this.anim = 0.0;
    }

    place(tile) {
      this.x = tile[0] * TILE + TILE / 2;
      this.y = tile[1] * TILE + TILE / 2;
    }

    hitbox() {
      return {
        x: Math.round(this.x) - this.HB_W / 2,
        y: Math.round(this.y) - this.HB_H / 2,
        w: this.HB_W,
        h: this.HB_H
      };
    }

    centerTile() {
      return [Math.floor(this.x / TILE), Math.floor(this.y / TILE)];
    }

    update(dt, solids) {
      let dx = (isHeld(RIGHT_CODES) ? 1 : 0) - (isHeld(LEFT_CODES) ? 1 : 0);
      let dy = (isHeld(DOWN_CODES) ? 1 : 0) - (isHeld(UP_CODES) ? 1 : 0);
      this.walking = !!(dx || dy);
      if (!this.walking) {
        this.anim = 0.0;
        return;
      }
      if (dx && dy) {
        dx *= 0.7071;
        dy *= 0.7071;
      }
      if (dy) this.facing = dy > 0 ? "down" : "up";
      if (dx && !dy) this.facing = dx > 0 ? "right" : "left";
      this.anim += dt;
      this._moveAxis(dx * this.SPEED * dt, 0, solids);
      this._moveAxis(0, dy * this.SPEED * dt, solids);
    }

    _moveAxis(mx, my, solids) {
      this.x += mx;
      this.y += my;
      const box = this.hitbox();
      for (const s of solids) {
        if (rectOverlap(box, s)) {
          if (mx > 0) box.x = s.x - box.w;
          else if (mx < 0) box.x = s.x + s.w;
          if (my > 0) box.y = s.y - box.h;
          else if (my < 0) box.y = s.y + s.h;
          this.x = box.x + box.w / 2;
          this.y = box.y + box.h / 2;
        }
      }
    }

    draw(ctx) {
      const bx = Math.round(this.x);
      const by = Math.round(this.y + this.HB_H / 2);
      fillEllipse(ctx, bx - 11, by - 5, 22, 9, BLACK);
      const frame = this.walking ? Math.floor(this.anim * 8) % 2 : 0;
      ctx.fillStyle = rgb(60, 50, 80);
      ctx.fillRect(bx - 7, by - 7 - (frame ? 2 : 0), 5, 7);
      ctx.fillRect(bx + 2, by - 7 - (frame ? 0 : 2), 5, 7);
      ctx.fillStyle = rgb(90, 140, 200);
      ctx.fillRect(bx - 9, by - 21, 18, 15);
      ctx.fillStyle = rgb(210, 80, 80);
      ctx.fillRect(bx - 9, by - 22, 18, 4);
      fillCircle(ctx, bx, by - 28, 9, rgb(245, 205, 170));
      const hair = rgb(70, 50, 60);
      if (this.facing === "up") {
        fillCircle(ctx, bx, by - 28, 9, hair);
      } else {
        ctx.fillStyle = hair;
        ctx.fillRect(bx - 9, by - 37, 18, 7);
      }
      const eye = rgb(30, 20, 40);
      ctx.fillStyle = eye;
      if (this.facing === "down") {
        ctx.fillRect(bx - 5, by - 28, 2, 4);
        ctx.fillRect(bx + 3, by - 28, 2, 4);
        fillCircle(ctx, bx, by - 15, 3, BELL);
      } else if (this.facing === "left") {
        ctx.fillRect(bx - 7, by - 28, 2, 4);
      } else if (this.facing === "right") {
        ctx.fillRect(bx + 5, by - 28, 2, 4);
      }
    }
  }

  class DialogueBox {
    constructor(ctx, speaker, pages, voice = "blip", onClose = null) {
      this.speaker = speaker;
      this.voice = voice;
      this.onClose = onClose;
      this.TEXT_W = W - 60 - 40;
      this.pages = [];
      for (const p of pages) {
        this.pages.push(...paginateText(ctx, p, 20, this.TEXT_W, 3));
      }
      this.i = 0;
      this.writer = new Typewriter(this.pages[0], 40, voice);
      this.t = 0.0;
    }

    advance() {
      if (!this.writer.done) {
        this.writer.finish();
        return false;
      }
      this.i++;
      if (this.i >= this.pages.length) return true;
      this.writer = new Typewriter(this.pages[this.i], 40, this.voice);
      return false;
    }

    update(dt) {
      this.t += dt;
      this.writer.update(dt);
    }

    draw(ctx, top = false) {
      const rect = { x: 30, y: top ? 20 : 340, w: W - 60, h: 120 };
      drawPanel(ctx, rect);
      let y = rect.y + 14;
      if (this.speaker) {
        setFont(ctx, 16);
        ctx.fillStyle = YELLOW;
        ctx.fillText(this.speaker, rect.x + 18, rect.y + 10);
        y = rect.y + 36;
      }
      drawTyped(ctx, 20, this.writer.text, this.writer.shown, rect.x + 18, y, 26);
      if (this.writer.done && Math.floor(this.t * 2) % 2 === 0) {
        fillPoly(ctx, [
          [rect.x + rect.w - 34, rect.y + rect.h - 22],
          [rect.x + rect.w - 20, rect.y + rect.h - 22],
          [rect.x + rect.w - 27, rect.y + rect.h - 12]
        ], YELLOW);
      }
    }
  }

    constructor(room, tile, item, flag) { super(room, tile, [24, 14], true); this.item = item; this.flag = flag; }
    draw(ctx, t, game) { drawChest(ctx, Math.round(this.x), Math.round(this.y), !!game.flags[this.flag]); }
    interact(ow) {
      const g = ow.game;
      if (g.flags[this.flag]) {

        AUDIO.sfx("error");
        ow.say("", ["Your pockets are full. You cannot carry anything else."]);

        g.flags[this.flag] = true;
        g.items.push(this.item);
        AUDIO.sfx("heal");
        ow.say("", [`You found a ${this.item}! (Added to your items.)`]);
      }
    }
  }
