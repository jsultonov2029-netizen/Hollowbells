  class Monster {
    constructor(uid, key, room, tile, roam) {
      this.uid = uid;
      this.key = key;
      this.room = room;
      this.home = [tile[0] * TILE + TILE / 2, tile[1] * TILE + TILE / 2];
      this.roam = roam;
      this.x = this.home[0];
      this.y = this.home[1];
      this.alive = true;
      this.t = Math.random() * 6;
    }

    update(dt) {
      this.t += dt;
      this.x = this.home[0] + Math.sin(this.t * 1.3) * this.roam[0];
      this.y = this.home[1] + Math.sin(this.t * 1.9) * this.roam[1];
    }

    get rect() {
      const [w, h] = ENEMIES[this.key].hitbox;
      return { x: Math.round(this.x) - w / 2, y: Math.round(this.y) - h / 2, w, h };
    }

    draw(ctx) {
      const d = ENEMIES[this.key];
      const [w, h] = d.hitbox;
      fillEllipse(ctx, Math.round(this.x) - w / 2, Math.round(this.y) + h / 2 - 4, w, 8, BLACK);
      d.draw(ctx, Math.round(this.x), Math.round(this.y), this.t, d.oscale);
    }
  }

  // =========================================================================
  // BULLETS & ALL 12 DODGE PATTERNS
  // =========================================================================
  class Bullet {
    constructor(x, y, vx, vy, r = 5, color = [255, 255, 255], opts = {}) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.r = r; this.color = color;
      this.w = opts.w || 0;
      this.h = opts.h || 0;
      this.fuse = opts.fuse !== undefined ? opts.fuse : null;
      this.bounce = !!opts.bounce;
      this.ay = opts.ay || 0.0;
      this.warn = opts.warn || 0.0;
      this.life = opts.life !== undefined ? opts.life : null;
      this.dead = false;
    }

    update(dt, inner) {
      const spawned = [];
      if (this.warn > 0) {
        this.warn -= dt;
        return spawned;
      }
      if (this.life !== null) {
        this.life -= dt;
        if (this.life <= 0) this.dead = true;
      }
      this.vy += this.ay * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.bounce) {
        if (this.x < inner.x + this.r) { this.x = inner.x + this.r; this.vx = Math.abs(this.vx); }
        else if (this.x > inner.x + inner.w - this.r) { this.x = inner.x + inner.w - this.r; this.vx = -Math.abs(this.vx); }
        if (this.y < inner.y + this.r) { this.y = inner.y + this.r; this.vy = Math.abs(this.vy); }
        else if (this.y > inner.y + inner.h - this.r) { this.y = inner.y + inner.h - this.r; this.vy = -Math.abs(this.vy); }
      }
      if (this.fuse !== null) {
        this.fuse -= dt;
        if (this.fuse <= 0) {
          this.dead = true;
          for (let k = 0; k < 8; k++) {
            const a = k * Math.PI / 4;
            spawned.push(new Bullet(this.x, this.y, Math.cos(a) * 110, Math.sin(a) * 110, 4, [210, 130, 255]));
          }
        }
      }
      return spawned;
    }

    hits(hx, hy) {
      if (this.warn > 0) return false;
      if (this.w) {
        const box = { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h };
        return rectOverlap(box, { x: hx - 4, y: hy - 4, w: 8, h: 8 });
      }
      return (this.x - hx) ** 2 + (this.y - hy) ** 2 <= (this.r + 3.5) ** 2;
    }

    draw(ctx) {
      const col = rgb(...this.color);
      if (this.w) {
        const bx = Math.round(this.x - this.w / 2), by = Math.round(this.y - this.h / 2);
        if (this.warn > 0) {
          if (Math.floor(this.warn * 14) % 2 === 0) {
            ctx.strokeStyle = rgb(150, 60, 60);
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, this.w, this.h);
          }
        } else {
          ctx.fillStyle = col;
          ctx.fillRect(bx, by, this.w, this.h);
        }
      } else {
        const dim = rgb(...this.color.map(c => (c / 3) | 0));
        fillCircle(ctx, this.x, this.y, this.r + 2, dim);
        fillCircle(ctx, this.x, this.y, this.r, col);
      }
    }
  }

  class Pattern {
    constructor(arena, heart, k) {
      this.a = arena;
      this.heart = heart;
      this.k = k;
      this.t = 0.0;
      this.acc = 0.0;
      this.mode = "red";
      this.duration = 5.0;
    }
    due(dt, interval) {
      this.acc += dt;
      let n = 0;
      while (this.acc >= interval) {
        this.acc -= interval;
        n++;
      }
      return n;
    }
    update(dt, bullets) { this.t += dt; }
  }

  class Rain extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const count = this.due(dt, 0.30 / this.k);
      for (let i = 0; i < count; i++) {
        bullets.push(new Bullet(randRange(this.a.x + 8, this.a.x + this.a.w - 8), this.a.y - 6,
          0, 105 * (0.9 + 0.2 * this.k), 5, [140, 200, 255]));
      }
    }
  }

  class Aimed extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const count = this.due(dt, 0.75 / this.k);
      for (let i = 0; i < count; i++) {
        const side = randChoice(["l", "r", "t"]);
        let x, y;
        if (side === "l") { x = this.a.x - 6; y = randRange(this.a.y, this.a.y + this.a.h); }
        else if (side === "r") { x = this.a.x + this.a.w + 6; y = randRange(this.a.y, this.a.y + this.a.h); }
        else { x = randRange(this.a.x, this.a.x + this.a.w); y = this.a.y - 6; }
        const [hx, hy] = this.heart();
        const ang = Math.atan2(hy - y, hx - x);
        bullets.push(new Bullet(x, y, Math.cos(ang) * 125, Math.sin(ang) * 125, 5, [255, 170, 90]));
      }
    }
  }

  class Spiral extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const count = this.due(dt, 0.11 / this.k);
      const cx = this.a.x + this.a.w / 2, cy = this.a.y + this.a.h / 2;
      for (let i = 0; i < count; i++) {
        const ang = this.t * 3.2;
        bullets.push(new Bullet(cx, cy, Math.cos(ang) * 95, Math.sin(ang) * 95, 4, [255, 230, 120]));
      }
    }
  }

  class Waves extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const amp = this.a.h / 2 - 14;
      const cy = this.a.y + this.a.h / 2;
      const count = this.due(dt, 0.14 / this.k);
      for (let i = 0; i < count; i++) {
        const y = cy + Math.sin(this.t * 3) * amp;
        bullets.push(new Bullet(this.a.x + this.a.w + 6, y, -135, 0, 4, [190, 255, 190]));
        bullets.push(new Bullet(this.a.x - 6, 2 * cy - y, 135, 0, 4, [190, 255, 190]));
      }
    }
  }

  class Burst extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 5.5; }
    update(dt, bullets) {
      this.t += dt;
      const count = this.due(dt, 1.1 / this.k);
      for (let i = 0; i < count; i++) {
        bullets.push(new Bullet(randRange(this.a.x + 20, this.a.x + this.a.w - 20),
          randRange(this.a.y + 10, this.a.y + this.a.h / 2),
          0, 30, 6, [210, 130, 255], { fuse: 0.7 }));
      }
    }
  }

  class Bounce extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.started = false; }
    update(dt, bullets) {
      this.t += dt;
      if (!this.started) {
        this.started = true;
        const n = Math.max(2, Math.floor(4 * this.k));
        for (let i = 0; i < n; i++) {
          const ang = randRange(0, Math.PI * 2);
          bullets.push(new Bullet(randRange(this.a.x + 10, this.a.x + this.a.w - 10),
            randRange(this.a.y + 10, this.a.y + this.a.h / 2),
            Math.cos(ang) * 105, Math.sin(ang) * 105, 6, [130, 190, 255], { bounce: true }));
        }
      }
    }
  }

  class Toll extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.mode = "blue"; this.duration = 6.5; this.n = 0; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const speed = -150 * (0.9 + 0.2 * this.k);
      const count = this.due(dt, 0.95 / this.k);
      for (let i = 0; i < count; i++) {
        if (this.n % 2 === 0) {
          bullets.push(new Bullet(a.x + a.w + 10, a.y + a.h - 7, speed, 0, 0, [255, 255, 255], { w: 16, h: 14 }));
        } else {
          const h = a.h - 28;
          bullets.push(new Bullet(a.x + a.w + 10, a.y + h / 2, speed, 0, 0, [255, 200, 120], { w: 16, h }));
        }
        this.n++;
      }
    }
  }

  class Chorus extends Pattern {
    constructor(arena, heart, k) {
      super(arena, heart, k);
      this.parts = [new Spiral(arena, heart, k * 0.7), new Rain(arena, heart, k * 0.8)];
    }
    update(dt, bullets) {
      this.t += dt;
      for (const p of this.parts) p.update(dt, bullets);
    }
  }

  class Pulse extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 5.5; this.n = 0; }
    update(dt, bullets) {
      this.t += dt;
      const cx = this.a.x + this.a.w / 2, cy = this.a.y + this.a.h / 2;
      const count = this.due(dt, 1.2 / this.k);
      for (let c = 0; c < count; c++) {
        const off = this.n * 0.4;
        for (let i = 0; i < 10; i++) {
          const ang = off + i * Math.PI * 2 / 10;
          bullets.push(new Bullet(cx, cy, Math.cos(ang) * 85, Math.sin(ang) * 85, 4, [255, 120, 170]));
        }
        this.n++;
      }
    }
  }

  class Lanes extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 6.0; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const count = this.due(dt, 1.5 / this.k);
      for (let c = 0; c < count; c++) {
        const gap = randRange(a.y + 20, a.y + a.h - 20);
        let y = a.y + 6;
        while (y < a.y + a.h - 4) {
          if (Math.abs(y - gap) > 24) {
            bullets.push(new Bullet(a.x + a.w + 6, y, -95, 0, 4, [150, 255, 170]));
          }
          y += 14;
        }
      }
    }
  }

  class Ember extends Pattern {
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const count = this.due(dt, 0.4 / this.k);
      for (let i = 0; i < count; i++) {
        bullets.push(new Bullet(randRange(a.x + 8, a.x + a.w - 8), a.y + a.h + 4,
          randRange(-40, 40), -randRange(180, 240), 5, [255, 140, 50], { ay: 320 }));
      }
    }
  }

  class Sweep extends Pattern {
    constructor(arena, heart, k) { super(arena, heart, k); this.duration = 6.0; this.n = 0; }
    update(dt, bullets) {
      this.t += dt;
      const a = this.a;
      const count = this.due(dt, 1.5 / this.k);
      for (let i = 0; i < count; i++) {
        if (this.n % 2 === 0) {
          const y = randRange(a.y + 12, a.y + a.h - 12);
          bullets.push(new Bullet(a.x + a.w / 2, y, 0, 0, 0, [255, 90, 90], { w: a.w, h: 12, warn: 0.7, life: 0.4 }));
        } else {
          const x = randRange(a.x + 12, a.x + a.w - 12);
          bullets.push(new Bullet(x, a.y + a.h / 2, 0, 0, 0, [255, 90, 90], { w: 12, h: a.h, warn: 0.7, life: 0.4 }));
        }
        this.n++;
      }
    }
  }

  const PATTERNS = {
    rain: Rain, aimed: Aimed, spiral: Spiral, waves: Waves, burst: Burst,
    bounce: Bounce, toll: Toll, chorus: Chorus, pulse: Pulse, lanes: Lanes,
    ember: Ember, sweep: Sweep
  };

  // =========================================================================
  // GAME STATES
  // =========================================================================
  class State {
    constructor(game) { this.game = game; }
    handleKeyDown(e) {}
    update(dt) {}
    draw(ctx) {}
  }

  const BAR_X0 = 60, BAR_W = 520;

  // --- BATTLE STATE ---
  class BattleState extends State {
    constructor(game, overworld, monster) {
      super(game);
      this.BTN = ["FIGHT", "ACT", "ITEM", "MERCY"];
      this.MENU_BOX = { x: 40, y: 270, w: 560, h: 100 };
      this.ARENA = { x: 220, y: 236, w: 200, h: 134 };
      this.TEXT_W = 490;

      this.ow = overworld;
      this.mon = monster;
      this.d = ENEMIES[monster.key];
      this.hp = this.d.hp;
      this.t = 0.0;
      this.fade = 255.0;
      this.sel = 0;
      this.sub = 0;
      this.mercy = 0;
      this.anger = 0;
      this.used = new Set();
      this.turn = 0;
      this.phaseIdx = 0;
      this.flavorI = (Math.random() * 6) | 0;
      this.menuText = "";
      this.shake = 0.0;
      this.hitTimer = 0.0;
      this.hitDmg = 0;
      this.barX = 0.0;
      this.queue = [];
      this.after = null;
      this.writer = new Typewriter("", 40, "blip");
      this.phase = "text";
      this.boxP = 0.0;
      this.boxGoal = 0.0;
      this.bullets = [];
      this.pattern = null;
      this.hx = 0.0;
      this.hy = 0.0;
      this.hvy = 0.0;
      this.mode = "red";
      this.inv = 0.0;
      this.dodgeT = 0.0;
      this.bubble = null;
      this.bubbleWait = 0.0;
      this.deadT = 0.0;
      this.shards = [];
      this.stars = Array.from({ length: 40 }, () => [randRange(0, W), randRange(0, H), randRange(8, 28)]);
      AUDIO.playMusic(this.d.music);
      this.say([this.d.intro], () => this.showMenuFresh());
    }

    say(lines, after) {
      const pages = [];
      for (const ln of lines) {
        pages.push(...paginateText(this.game.ctx, ln, 20, this.TEXT_W, 3));
      }
      this.queue = pages;
      this.after = after;
      this.phase = "text";
      this.writer = new Typewriter(this.queue.shift(), 40, "blip");
    }

    showMenuFresh() {
      const flavors = this.d.flavor;
      const text = flavors[this.flavorI % flavors.length];
      this.flavorI++;
      this.menuText = paginateText(this.game.ctx, text, 20, this.TEXT_W, 3)[0];
      this.showMenu();
    }

    showMenu() {
      this.phase = "menu";
      this.writer = new Typewriter(this.menuText, 40, "blip");
    }

    choose() {
      if (this.sel === 0) {
        this.phase = "fight";
        this.barX = 0.0;
      } else if (this.sel === 1) {
        this.phase = "act";
        this.sub = 0;
      } else if (this.sel === 2) {
        if (this.game.items.length) {
          this.phase = "item";
          this.sub = 0;
        } else {
          AUDIO.sfx("error");
          this.say(["You have no items."], () => this.showMenu());
        }
      } else {
        this.doMercy();
      }
    }

    doAct(i) {
      let [label, text, gain, anger] = this.d.acts[i];
      if (gain) {
        if (this.used.has(label)) {
          text = "You try that again, but nothing changes.";
        } else {
          this.used.add(label);
          this.mercy = Math.min(100, this.mercy + gain);
          if (this.mercy >= 100) {
            text += "\n(It looks ready to be spared.)";
          }
        }
      }
      this.anger = Math.min(3, this.anger + anger);
      this.say([text], () => this.enemyTurn());
    }

    doMercy() {
      if (this.mercy >= 100) {
        this.game.gold += this.d.gold;
        this.say([this.d.spared, `You earned ${this.d.gold} gold.`], () => this.finish("spare"));
      } else {
        this.say([this.d.spare_fail], () => this.enemyTurn());
      }
    }

    useItem(i) {
      const msg = this.game.useItem(i);
      this.say([msg], () => this.enemyTurn());
    }

    doHit() {
      const g = this.game;
      const acc = Math.max(0.0, 1 - Math.abs(this.barX - BAR_W / 2) / (BAR_W / 2));
      const dmg = acc < 0.08
        ? 0
        : Math.max(1, Math.round(2 + acc * (9 + g.atk)) + Math.floor(g.atk / 2) - this.d.defense);
      this.hitDmg = dmg;
      this.hp -= dmg;
      this.shake = dmg ? 0.6 : 0.0;
      this.hitTimer = 1.1;
      this.phase = "fight_hit";
      AUDIO.sfx("slash");
      if (dmg) g.shake(5, 0.2);
    }

    winKill() {
      const g = this.game;
      const exp = this.d.exp, gold = this.d.gold;
      const before = g.lv;
      g.gainExp(exp);
      g.gold += gold;
      const lines = [this.d.win, `You earned ${exp} EXP and ${gold} gold.`];
      if (g.lv > before) {
        AUDIO.sfx("heal");
        lines.push(`Your LV rose to ${g.lv}! Max HP up!`);
      }
      this.say(lines, () => this.finish("kill"));
    }

    finish(result) {
      const g = this.game;
      const m = this.mon;
      m.alive = false;
      g.defeated.add(m.uid);
      if (result === "kill") g.kills++;
      else g.spares++;
      if (this.d.flag) g.flags[this.d.flag] = true;
      const role = this.d.role;
      if (role === "act1") {
        const kind = result === "kill" ? "hollow" : (g.kills === 0 ? "mercy" : "neutral");
        g.changeState(new EndingState(g, kind));
      } else if (role === "act2") {
        if (result === "kill") {
          g.changeState(new EndingState(g, "overgrown"));
        } else if (g.kills > 0) {
          g.changeState(new EndingState(g, "rootbound"));
        } else {
          g.changeState(new ChoiceState(
            g,
            "The roots fall quiet. Wick's voice drifts down the stair: 'The surface is open. What will you do, little one?'",
            ["Climb to the surface", "Stay and tend the cave"],
            [() => new EndingState(g, "dawn"), () => new EndingState(g, "keeper")]
          ));
        }
      } else {
        this.ow.fade = 255.0;
        this.ow.fading = "in";
        this.ow.playRoomMusic();
        g.changeState(this.ow);
      }
    }

    computePhase() {
      let idx = 0;
      for (let i = 0; i < this.d.phase_hp.length; i++) {
        const frac = this.d.phase_hp[i];
        const tn = this.d.phase_turn[i];
        if (this.hp <= this.d.hp * frac || this.turn >= tn) idx = i + 1;
      }
      return idx;
    }

    enemyTurn() {
      const idx = this.computePhase();
      if (idx > this.phaseIdx) {
        this.phaseIdx = idx;
        AUDIO.sfx("bell");
        this.game.shake(8, 0.5);
        this.say([this.d.phase_text[idx - 1]], () => this.beginTalk());
        return;
      }
      this.beginTalk();
    }

    pickTalk() {
      const talk = this.d.talk;
      if (this.anger > 0 && Math.random() < 0.6) return randChoice(talk.angry);
      if (this.mercy >= 100) return randChoice(talk.calm);
      if (this.mercy >= 50) return randChoice(talk.mid);
      return randChoice(talk.base);
    }

    beginTalk() {
      this.turn++;
      const line = wrapText(this.game.ctx, this.pickTalk(), 16, 176).join("\n");
      this.bubble = new Typewriter(line, 30, "blip_low");
      this.bubbleWait = 0.0;
      this.phase = "talk";
    }

    startDodge() {
      const lists = this.d.phases;
      const seq = lists[Math.min(this.phaseIdx, lists.length - 1)];
      const name = seq[this.turn % seq.length];
      const k = clamp(1.0 + 0.25 * this.anger - 0.5 * this.mercy / 100, 0.45, 1.6);
      const inner = rectInflate(this.ARENA, -12, -12);
      const PatternCls = PATTERNS[name];
      this.pattern = new PatternCls(inner, () => [this.hx, this.hy], k);
      this.mode = this.pattern.mode;
      this.hx = inner.x + inner.w / 2;
      this.hy = this.mode === "blue" ? (inner.y + inner.h - 5) : (inner.y + inner.h - 24);
      this.hvy = 0.0;
      this.bullets = [];
      this.dodgeT = 0.0;
      this.inv = 0.8;
      this.boxGoal = 1.0;
      this.phase = "dodge";
    }

    updateHeart(dt) {
      const dx = (isHeld(RIGHT_CODES) ? 1 : 0) - (isHeld(LEFT_CODES) ? 1 : 0);
      const dy = (isHeld(DOWN_CODES) ? 1 : 0) - (isHeld(UP_CODES) ? 1 : 0);
      const slow = isHeld(SKIP_CODES);
      const sp = 150 * (slow ? 0.5 : 1.0);
      const inner = rectInflate(this.ARENA, -12, -12);
      const left = inner.x + 5, right = inner.x + inner.w - 5;
      const top = inner.y + 5, bottom = inner.y + inner.h - 5;
      this.hx += dx * sp * dt;
      if (this.mode === "red") {
        this.hy += dy * sp * dt;
      } else {
        const jump = isHeld(UP_CODES) || isHeld(CONFIRM_CODES);
        if (jump && this.hy >= bottom - 0.5) {
          this.hvy = -300;
        }
        this.hvy += 820 * dt;
        this.hy += this.hvy * dt;
        if (this.hy >= bottom) { this.hy = bottom; this.hvy = 0.0; }
        if (this.hy <= top) { this.hy = top; this.hvy = Math.max(0.0, this.hvy); }
      }
      this.hx = clamp(this.hx, left, right);
      this.hy = clamp(this.hy, top, bottom);
    }

    updateBullets(dt) {
      const inner = rectInflate(this.ARENA, -12, -12);
      const limit = rectInflate(this.ARENA, 120, 120);
      const keep = [], nextNew = [];
      for (const b of this.bullets) {
        nextNew.push(...b.update(dt, inner));
        if (b.dead || !rectContains(limit, b.x, b.y)) continue;
        if (this.inv <= 0 && b.hits(this.hx, this.hy)) {
          this.hurt();
        }
        keep.push(b);
      }
      this.bullets = keep.concat(nextNew);
      this.inv = Math.max(0.0, this.inv - dt);
    }

    hurt() {
      const g = this.game;
      const dmg = Math.max(1, this.d.atk + Math.min(2, this.phaseIdx) - g.defense);
      g.hp -= dmg;
      this.inv = 1.1;
      AUDIO.sfx("hit");
      g.shake(6, 0.25);
      g.flash([255, 0, 0], 0.15);
      if (g.hp <= 0) {
        g.hp = 0;
        this.phase = "dying";
        this.deadT = 0.0;
        this.bullets = [];
        AUDIO.playMusic(null);
      }
    }

    moveBox(dt) {
      if (this.boxP < this.boxGoal) this.boxP = Math.min(this.boxGoal, this.boxP + dt * 5);
      else if (this.boxP > this.boxGoal) this.boxP = Math.max(this.boxGoal, this.boxP - dt * 5);
    }

    boxRect() {
      const a = this.MENU_BOX, b = this.ARENA, p = this.boxP;
      return {
        x: Math.round(a.x + (b.x - a.x) * p),
        y: Math.round(a.y + (b.y - a.y) * p),
        w: Math.round(a.w + (b.w - a.w) * p),
        h: Math.round(a.h + (b.h - a.h) * p),
      };
    }

    handleKeyDown(e) {
      const k = e.code;
      const confirm = CONFIRM_CODES.has(k);
      const ph = this.phase;
      if (ph === "text") {
        if (confirm) {
          if (!this.writer.done) this.writer.finish();
          else if (this.queue.length) this.writer = new Typewriter(this.queue.shift(), 40, "blip");
          else this.after();
        }
      } else if (ph === "menu") {
        if (LEFT_CODES.has(k)) { this.sel = (this.sel + 3) % 4; AUDIO.sfx("select"); }
        else if (RIGHT_CODES.has(k)) { this.sel = (this.sel + 1) % 4; AUDIO.sfx("select"); }
        else if (confirm) { AUDIO.sfx("confirm"); this.choose(); }
      } else if (ph === "act" || ph === "item") {
        const labels = ph === "act" ? this.d.acts.map(a => a[0]) : this.game.items;
        if (UP_CODES.has(k)) { this.sub = (this.sub - 1 + labels.length) % labels.length; AUDIO.sfx("select"); }
        else if (DOWN_CODES.has(k)) { this.sub = (this.sub + 1) % labels.length; AUDIO.sfx("select"); }
        else if (BACK_CODES.has(k)) this.showMenu();
        else if (confirm) {
          AUDIO.sfx("confirm");
          if (ph === "act") this.doAct(this.sub);
          else this.useItem(this.sub);
        }
      } else if (ph === "fight") {
        if (confirm) this.doHit();
      } else if (ph === "talk") {
        if (confirm) {
          if (!this.bubble.done) this.bubble.finish();
          else this.startDodge();
        }
      }
    }

    update(dt) {
      this.t += dt;
      this.fade = Math.max(0.0, this.fade - 600 * dt);
      this.shake = Math.max(0.0, this.shake - dt);
      for (const s of this.stars) {
        s[1] += s[2] * dt;
        if (s[1] > H) { s[0] = randRange(0, W); s[1] = 0; }
      }
      const ph = this.phase;
      if (ph === "text" || ph === "menu") {
        this.writer.update(dt);
      } else if (ph === "fight") {
        this.barX += 420 * dt;
        if (this.barX >= BAR_W) {
          this.barX = BAR_W;
          this.doHit();
        }
      } else if (ph === "fight_hit") {
        this.hitTimer -= dt;
        if (this.hitTimer <= 0) {
          if (this.hp <= 0) this.winKill();
          else this.enemyTurn();
        }
      } else if (ph === "talk") {
        this.bubble.update(dt);
        if (this.bubble.done) {
          this.bubbleWait += dt;
          if (this.bubbleWait > 1.3) this.startDodge();
        }
      } else if (ph === "dodge") {
        this.moveBox(dt);
        if (this.boxP >= 1.0) {
          this.updateHeart(dt);
          this.dodgeT += dt;
          this.pattern.update(dt, this.bullets);
          this.updateBullets(dt);
          if (this.dodgeT >= this.pattern.duration && this.phase === "dodge") {
            this.boxGoal = 0.0;
            this.bullets = [];
            this.phase = "retract";
          }
        }
      } else if (ph === "retract") {
        this.moveBox(dt);
        if (this.boxP <= 0.0) this.showMenuFresh();
      } else if (ph === "dying") {
        this.deadT += dt;
        if (this.deadT >= 0.6 && !this.shards.length) {
          AUDIO.sfx("break");
          this.shards = Array.from({ length: 6 }, () => [this.hx, this.hy, randRange(-90, 90), randRange(-160, -40)]);
        }
        for (const s of this.shards) {
          s[0] += s[2] * dt;
          s[1] += s[3] * dt;
          s[3] += 380 * dt;
        }
        if (this.deadT >= 2.4) this.game.changeState(new GameOverState(this.game));
      }
    }

    draw(ctx) {
      ctx.fillStyle = BLACK;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = rgb(40, 40, 72);
      for (const [sx, sy] of this.stars) ctx.fillRect(sx | 0, sy | 0, 2, 2);

      const offs = this.shake > 0 ? Math.round(Math.sin(this.t * 60) * this.shake * 16) : 0;
      if (this.hp > 0 && this.phase !== "dying") {
        const cy = this.d.bcy + Math.round(Math.sin(this.t * 2) * 4);
        this.d.draw(ctx, W / 2 + offs, cy, this.t, this.d.bscale);
      }

      if (this.phase === "fight_hit") {
        if (this.hitTimer > 0.75) {
          for (let i = 0; i < 3; i++) {
            drawLine(ctx, W / 2 - 50 + i * 14, 90, W / 2 + 10 + i * 14, 200, WHITE, 3);
          }
        }
        const bar = { x: W / 2 - 60, y: 222, w: 120, h: 12 };
        ctx.fillStyle = rgb(120, 0, 0);
        ctx.fillRect(bar.x, bar.y, bar.w, bar.h);
        const frac = Math.max(0, this.hp) / this.d.hp;
        ctx.fillStyle = GREEN;
        ctx.fillRect(bar.x, bar.y, Math.round(bar.w * frac), bar.h);
        const txt = this.hitDmg === 0 ? "MISS" : String(this.hitDmg);
        drawCenteredText(ctx, txt, 30, W / 2, 200 - Math.round((1 - this.hitTimer) * 14), this.hitDmg ? RED : GREY);
      }

      if (this.phase === "talk") {
        const lines = this.bubble.text.split("\n");
        const bh = 16 + 20 * lines.length;
        const br = { x: W / 2 + this.d.bubble_dx, y: 50, w: 200, h: bh };
        ctx.fillStyle = WHITE;
        ctx.fillRect(br.x, br.y, br.w, br.h);
        fillPoly(ctx, [[br.x, br.y + 20], [br.x - 14, br.y + 28], [br.x, br.y + 34]], WHITE);
        drawTyped(ctx, 16, this.bubble.text, this.bubble.shown, br.x + 12, br.y + 8, 20, BLACK);
      }

      const box = this.boxRect();
      drawPanel(ctx, box);
      const ph = this.phase;

      if (ph === "text" || ph === "menu") {
        setFont(ctx, 20);
        ctx.fillStyle = WHITE;
        ctx.fillText("*", 64, 286);
        drawTyped(ctx, 20, this.writer.text, this.writer.shown, 86, 286, 24);
      } else if (ph === "act") {
        drawMenuList(ctx, 20, this.d.acts.map(a => a[0]), this.sub, 90, 286, 26);
      } else if (ph === "item") {
        drawMenuList(ctx, 20, this.game.items, this.sub, 90, 286, 26);
      } else if (ph === "fight") {
        ctx.fillStyle = rgb(40, 40, 40);
        ctx.fillRect(BAR_X0, 300, BAR_W, 36);
        ctx.fillStyle = GREEN;
        ctx.fillRect(BAR_X0 + BAR_W / 2 - 20, 300, 40, 36);
        ctx.strokeStyle = WHITE;
        ctx.lineWidth = 3;
        ctx.strokeRect(BAR_X0, 300, BAR_W, 36);
        ctx.fillStyle = YELLOW;
        ctx.fillRect(BAR_X0 + Math.round(this.barX) - 3, 292, 6, 52);
      } else if ((ph === "dodge" || ph === "retract") && this.boxP >= 1.0) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(box.x + 4, box.y + 4, box.w - 8, box.h - 8);
        ctx.clip();
        for (const b of this.bullets) b.draw(ctx);
        ctx.restore();
        if (this.inv <= 0 || Math.floor(this.t * 20) % 2 === 0) {
          drawHeart(ctx, this.hx, this.hy + 1, 6, this.mode === "blue" ? BLUE : RED);
        }
      } else if (ph === "dying") {
        if (!this.shards.length) {
          drawHeart(ctx, this.hx, this.hy + 1, 6, RED);
        }
        for (const [sx, sy] of this.shards) {
          fillPoly(ctx, [[sx, sy - 3], [sx + 3, sy + 3], [sx - 3, sy + 3]], RED);
        }
      }

      const g = this.game;
      const statStr = `KIT  LV ${g.lv}   HP`;
      setFont(ctx, 20);
      ctx.fillStyle = WHITE;
      ctx.fillText(statStr, 40, 382);
      const statW = measureTextW(ctx, statStr, 20);
      const hpBar = { x: 40 + statW + 12, y: 384, w: 90, h: 20 };
      ctx.fillStyle = rgb(120, 0, 0);
      ctx.fillRect(hpBar.x, hpBar.y, hpBar.w, hpBar.h);
      ctx.fillStyle = YELLOW;
      ctx.fillRect(hpBar.x, hpBar.y, Math.round(hpBar.w * Math.max(0, g.hp) / g.max_hp), hpBar.h);
      ctx.fillStyle = WHITE;
      ctx.fillText(`${Math.max(0, g.hp)} / ${g.max_hp}`, hpBar.x + hpBar.w + 12, 382);

      for (let i = 0; i < this.BTN.length; i++) {
        const label = this.BTN[i];
        const r = { x: 40 + i * 142, y: 420, w: 124, h: 42 };
        const selected = i === this.sel;
        const color = selected ? YELLOW : ORANGE;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
        const tc = (label === "MERCY" && this.mercy >= 100) ? YELLOW : color;
        drawCenteredText(ctx, label, 20, r.x + r.w / 2 + 8, r.y + r.h / 2, tc);
        if (selected && this.phase === "menu") {
          drawHeart(ctx, r.x + 18, r.y + r.h / 2, 7);
        }
      }

      if (this.fade > 0) {
        ctx.fillStyle = rgb(0, 0, 0, this.fade / 255);
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  // --- PAUSE STATE ---
  function drawStats(ctx, g, rect) {
    drawPanel(ctx, rect);
    const nxt = g.expToNext();
    const lines = [
      "KIT",
      `LV  ${g.lv}`,
      `HP  ${g.hp}/${g.max_hp}`,
      `ATK ${g.atk}`,
      `DEF ${g.defense}`,
      `EXP ${g.exp}`,
      `NEXT ${nxt ? nxt : "-"}`,
      `GOLD ${g.gold}`
    ];
    setFont(ctx, 20);
    lines.forEach((line, n) => {
      ctx.fillStyle = n === 0 ? YELLOW : WHITE;
      ctx.fillText(line, rect.x + 16, rect.y + 14 + n * 24);
    });
  }

  class PauseState extends State {
    constructor(game, ow) {
      super(game);
      this.ow = ow;
      this.sub = 0;
      this.msg = "";
      AUDIO.sfx("confirm");
    }

    handleKeyDown(e) {
      const k = e.code;
      const g = this.game;
      if (PAUSE_CODES.has(k) || BACK_CODES.has(k)) {
        g.changeState(this.ow);
      } else if (g.items.length && UP_CODES.has(k)) {
        this.sub = (this.sub - 1 + g.items.length) % g.items.length;
        AUDIO.sfx("select");
      } else if (g.items.length && DOWN_CODES.has(k)) {
        this.sub = (this.sub + 1) % g.items.length;
        AUDIO.sfx("select");
      } else if (CONFIRM_CODES.has(k) && g.items.length) {
        this.msg = g.useItem(this.sub);
        this.sub = Math.min(this.sub, Math.max(0, g.items.length - 1));
      }
    }

    draw(ctx) {
      const g = this.game;
      ctx.fillStyle = BLACK;
      ctx.fillRect(0, 0, W, H);
      drawStats(ctx, g, { x: 24, y: 24, w: 190, h: 220 });

      const eq = { x: 24, y: 256, w: 190, h: 100 };
      drawPanel(ctx, eq);
      setFont(ctx, 16);
      ctx.fillStyle = WHITE;
      ctx.fillText("WEAPON " + g.weapon, eq.x + 12, eq.y + 12);
      ctx.fillText("ARMOR  " + g.armor, eq.x + 12, eq.y + 38);
      const pages = PAGE_FLAGS.filter(f => g.flags[f]).length;
      ctx.fillText(`PAGES  ${pages}/3`, eq.x + 12, eq.y + 64);

      const lst = { x: 230, y: 24, w: 386, h: 332 };
      drawPanel(ctx, lst);
      setFont(ctx, 20);
      ctx.fillStyle = YELLOW;
      ctx.fillText("ITEMS", lst.x + 16, lst.y + 10);
      if (!g.items.length) {
        ctx.fillStyle = GREY;
        ctx.fillText("(empty)", lst.x + 40, lst.y + 48);
      }
      ctx.fillStyle = WHITE;
      g.items.forEach((name, n) => {
        ctx.fillText(name, lst.x + 44, lst.y + 46 + n * 32);
      });
      if (g.items.length) {
        drawHeart(ctx, lst.x + 26, lst.y + 56 + this.sub * 32, 7);
      }

      const info = { x: 24, y: 372, w: 592, h: 84 };
      drawPanel(ctx, info);
      const text = this.msg || (g.items.length ? ITEMS[g.items[this.sub]].desc : "Nothing to carry.");
      drawTyped(ctx, 16, wrapText(ctx, text, 16, 560).slice(0, 3).join("\n"), 999, info.x + 16, info.y + 10, 22);

      setFont(ctx, 16);
      ctx.fillStyle = GREY;
      ctx.fillText("Z: use / equip     C or X: close", 24, 460);
    }
  }

  // --- SHOP STATE ---
  class ShopState extends State {
    constructor(game, ow, key) {
      super(game);
      this.ow = ow;
      this.shop = SHOPS[key];
      this.sub = 0;
      this.t = 0.0;
      this.msg = "Take your time!";
      AUDIO.playMusic(this.shop.music);
    }

    leave() {
      this.ow.playRoomMusic();
      this.game.changeState(this.ow);
    }

    handleKeyDown(e) {
      const k = e.code;
      const g = this.game;
      const stock = this.shop.stock;
      if (BACK_CODES.has(k) || PAUSE_CODES.has(k)) {
        this.leave();
      } else if (UP_CODES.has(k)) {
        this.sub = (this.sub - 1 + stock.length) % stock.length;
        AUDIO.sfx("select");
      } else if (DOWN_CODES.has(k)) {
        this.sub = (this.sub + 1) % stock.length;
        AUDIO.sfx("select");
      } else if (CONFIRM_CODES.has(k)) {
        const name = stock[this.sub];
        const price = ITEMS[name].price;
        if (g.gold < price) {
          AUDIO.sfx("error");
          this.msg = "Not enough gold, friend.";
        } else if (g.items.length >= INVENTORY_MAX) {
          AUDIO.sfx("error");
          this.msg = "Your pockets are full!";
        } else {
          g.gold -= price;
          g.items.push(name);
          AUDIO.sfx("buy");
          this.msg = `Sold! One ${name}.`;
        }
      }
    }

    update(dt) { this.t += dt; }

    draw(ctx) {
      const g = this.game;
      const stock = this.shop.stock;
      ctx.fillStyle = rgb(22, 16, 12);
      ctx.fillRect(0, 0, W, H);
      this.shop.art(ctx, 520, 130, this.t);

      const lst = { x: 24, y: 24, w: 400, h: 330 };
      drawPanel(ctx, lst);
      setFont(ctx, 20);
      ctx.fillStyle = YELLOW;
      ctx.fillText(this.shop.title, lst.x + 16, lst.y + 10);

      stock.forEach((name, n) => {
        setFont(ctx, 20);
        ctx.fillStyle = WHITE;
        ctx.fillText(name, lst.x + 44, lst.y + 48 + n * 40);
        setFont(ctx, 16);
        ctx.fillStyle = YELLOW;
        ctx.fillText(`${ITEMS[name].price}G`, lst.x + lst.w - 70, lst.y + 52 + n * 40);
      });
      drawHeart(ctx, lst.x + 26, lst.y + 58 + this.sub * 40, 7);

      const goldBox = { x: 440, y: 200, w: 176, h: 60 };
      drawPanel(ctx, goldBox);
      setFont(ctx, 20);
      ctx.fillStyle = WHITE;
      ctx.fillText(`GOLD ${g.gold}`, goldBox.x + 16, goldBox.y + 18);

      const info = { x: 24, y: 372, w: 592, h: 84 };
      drawPanel(ctx, info);
      const desc = ITEMS[stock[this.sub]].desc;
      drawTyped(ctx, 16, desc + "\n" + this.msg, 999, info.x + 16, info.y + 14, 24);

      setFont(ctx, 16);
      ctx.fillStyle = GREY;
      ctx.fillText("Z: buy     X: leave", 24, 460);
    }
  }

  // --- OVERWORLD STATE ---
  class OverworldState extends State {
    constructor(game) {
      super(game);
      this.rooms = {};
      this.room = this.getRoom(game.room_key);
      this.player = new Player(game.spawn);
      this.props = buildProps();
      this.monsters = MONSTER_SPAWNS
        .filter(spec => !game.defeated.has(spec[0]))
        .map(spec => new Monster(...spec));
      this.dialogue = null;
      this.t = 0.0;
      this.fade = 255.0;
      this.fading = "in";
      this.pending = null;
      this.battleTarget = null;
      this.alertT = 0.0;
      this.cutscene = null;
      this.bannerTime = 0.0;
      this.bannerChapter = null;
      this.fx = [];
      this.onEnterRoom();
    }

    getRoom(key) {
      if (!this.rooms[key]) this.rooms[key] = new Room(key);
      return this.rooms[key];
    }

    roomProps() {
      return this.props.filter(p => p.room === this.room.key && p.active(this.game));
    }

    roomMonsters() {
      return this.monsters.filter(m => m.room === this.room.key && m.alive);
    }

    solids() {
      return this.room.solids.concat(this.roomProps().filter(p => p.solid).map(p => p.rect));
    }

    playRoomMusic() { AUDIO.playMusic(this.room.music); }

    resetFx() {
      this.fx = [];
      if (this.room.fx) {
        this.fx = Array.from({ length: 36 }, () => [randRange(0, W), randRange(0, H), randRange(0, 6.28)]);
      }
    }

    updateFx(dt) {
      if (!this.room.fx) return;
      const [, vy, sway] = FX[this.room.fx];
      for (const p of this.fx) {
        p[1] += vy * dt;
        p[0] = ((p[0] + Math.sin(this.t + p[2]) * sway * dt) % W + W) % W;
        if (p[1] < -4) p[1] = H + 4;
        else if (p[1] > H + 4) p[1] = -4;
      }
    }

    onEnterRoom() {
      this.playRoomMusic();
      this.resetFx();
      this.game.room_key = this.room.key;
      this.bannerTime = 3.5;
      this.bannerChapter = null;
      const flag = "seen_" + this.room.key;
      if (this.room.chapter && !this.game.flags[flag]) {
        this.game.flags[flag] = true;
        this.bannerChapter = this.room.chapter;
      }
      if (this.room.key === "bellroom" && !this.game.defeated.has("boss")) {
        this.cutscene = "boss";
      } else if (this.room.key === "heartroot" && !this.game.defeated.has("heart")) {
        this.cutscene = "heart";
      }
    }

    say(speaker, pages, voice = "blip", onClose = null) {
      this.dialogue = new DialogueBox(this.game.ctx, speaker, pages, voice, onClose);
      this.player.walking = false;
    }

    startTransition(target, spawn) {
      this.pending = [target, spawn];
      this.fading = "out";
      AUDIO.sfx("door");
    }

    startBattle(monster) {
      this.battleTarget = monster;
      this.fading = "alert";
      this.alertT = (monster.uid === "boss" || monster.uid === "heart") ? 0.9 : 0.7;
      this.player.walking = false;
      AUDIO.sfx("alert");
    }

    enterPending() {
      const [key, spawn] = this.pending;
      this.room = this.getRoom(key);
      this.player.place(spawn);
      this.pending = null;
      this.fading = "in";
      this.onEnterRoom();
    }

    pushBack() {
      const [tx, ty] = this.player.centerTile();
      const dx = tx === 0 ? 1 : (tx === COLS - 1 ? -1 : 0);
      const dy = ty === 0 ? 1 : (ty === ROWS - 1 ? -1 : 0);
      this.player.place([tx + dx, ty + dy]);
    }

    runCutscene() {
      const kind = this.cutscene;
      this.cutscene = null;
      const g = this.game;
      if (kind === "boss") {
        const boss = this.monsters.find(m => m.uid === "boss");
        const lines = [
          "...You carry a light. I remember lights.",
          "Once I rang to call the valley home. Then the quarrel came, and I rang to end it.",
          "Now I only toll. TOLL. I cannot stop!"
        ];
        if (g.kills > 0) lines.push("I hear the cave's grief on your hands, little one.");
        lines.push("Leave me quiet, or learn what quiet costs!");
        this.say("Hush", lines, "blip_low", () => this.startBattle(boss));
      } else if (kind === "heart") {
        const heart = this.monsters.find(m => m.uid === "heart");
        const lines = [
          "...You came down so far, little light.",
          "The valley's quarrel did not end when the Bell fell quiet. It sank into the roots, and into me.",
          "I hold every angry echo the cave ever heard. If you take them away, there is nothing left of me."
        ];
        if (g.kills > 0) lines.push("I can feel the quiet of those you hurt. It is very heavy.");
        lines.push("So I will hold them tighter. Forgive me!");
        this.say("Heartroot", lines, "blip_low", () => this.startBattle(heart));
      }
    }

    handleKeyDown(e) {
      if (this.fading) return;
      const k = e.code;
      if (CONFIRM_CODES.has(k)) {
        if (this.dialogue) {
          if (this.dialogue.advance()) {
            const cb = this.dialogue.onClose;
            this.dialogue = null;
            if (cb) cb();
          }
          return;
        }
        const reach = rectInflate(this.player.hitbox(), 26, 26);
        const cands = this.roomProps().filter(p => rectOverlap(reach, p.rect));
        if (cands.length) {
          cands.sort((a, b) =>
            ((a.x - this.player.x) ** 2 + (a.y - this.player.y) ** 2) -
            ((b.x - this.player.x) ** 2 + (b.y - this.player.y) ** 2)
          );
          cands[0].interact(this);
        }
      } else if (PAUSE_CODES.has(k) && !this.dialogue) {
        this.game.changeState(new PauseState(this.game, this));
      }
    }

    update(dt) {
      this.t += dt;
      this.bannerTime = Math.max(0.0, this.bannerTime - dt);
      for (const m of this.monsters) m.update(dt);
      this.updateFx(dt);

      if (this.fading === "alert") {
        this.alertT -= dt;
        if (this.alertT <= 0) this.fading = "out";
        return;
      }
      if (this.fading === "out") {
        this.fade += 900 * dt;
        if (this.fade >= 255) {
          this.fade = 255;
          if (this.battleTarget) {
            const target = this.battleTarget;
            this.battleTarget = null;
            this.game.changeState(new BattleState(this.game, this, target));
          } else {
            this.enterPending();
          }
        }
        return;
      }
      if (this.fading === "in") {
        this.fade -= 900 * dt;
        if (this.fade <= 0) {
          this.fade = 0;
          this.fading = null;
        }
        return;
      }
      if (this.dialogue) {
        this.dialogue.update(dt);
        this.player.walking = false;
        return;
      }
      if (this.cutscene) {
        this.runCutscene();
        return;
      }

      this.player.update(dt, this.solids());
      const [tx, ty] = this.player.centerTile();
      const door = this.room.doors[`${tx},${ty}`];
      if (door) {
        const need = door.length > 2 ? door[2] : null;
        if (need && !this.game.flags[need]) {
          this.pushBack();
          AUDIO.sfx("error");
          this.say("", [door[3]]);
        } else {
          this.startTransition(door[0], door[1]);
        }
        return;
      }

      const box = this.player.hitbox();
      for (const m of this.roomMonsters()) {
        if (rectOverlap(box, m.rect)) {
          this.startBattle(m);
          return;
        }
      }
    }

    draw(ctx) {
      ctx.drawImage(this.room.surface, 0, 0);

      for (const [tx, ty, lamp] of this.room.lights) {
        const cx = tx * TILE + TILE / 2, cy = ty * TILE + TILE / 2;
        const alpha = (170 + Math.sin(this.t * 2.2 + tx) * 40) / 255;
        const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, 76);
        grad.addColorStop(0, `rgba(255, 230, 150, ${0.35 * alpha})`);
        grad.addColorStop(1, "rgba(255, 230, 150, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, 76, 0, Math.PI * 2);
        ctx.fill();
        if (lamp) {
          fillCircle(ctx, cx, cy, 5, rgb(255, 230, 150));
          strokeCircle(ctx, cx, cy, 7, BELL, 2);
        }
      }

      const drawables = [[this.player.y, c => this.player.draw(c)]];
      for (const p of this.roomProps()) {
        drawables.push([p.solid ? p.y : p.y - 40, c => p.draw(c, this.t, this.game)]);
      }
      for (const m of this.roomMonsters()) {
        drawables.push([m.y, c => m.draw(c)]);
      }
      drawables.sort((a, b) => a[0] - b[0]);
      for (const [, fn] of drawables) fn(ctx);

      if (this.room.fx) {
        const [color, , , size] = FX[this.room.fx];
        ctx.fillStyle = color;
        for (const [x, y] of this.fx) ctx.fillRect(x | 0, y | 0, size, size);
      }

      if (this.fading === "alert") {
        if (Math.floor(this.alertT * 10) % 2 === 0) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.27)";
          ctx.fillRect(0, 0, W, H);
        }
        drawCenteredText(ctx, "!", 34, Math.round(this.player.x), Math.round(this.player.y) - 62, YELLOW);
      }

      if (this.dialogue) {
        this.dialogue.draw(ctx, this.player.y > 290);
      } else if (this.bannerTime > 0) {
        const alpha = Math.min(1.0, this.bannerTime / 0.8);
        drawCenteredText(ctx, this.room.name, 22, W / 2, 24, WHITE, alpha);
        if (this.bannerChapter) {
          drawCenteredText(ctx, this.bannerChapter, 14, W / 2, 48, YELLOW, alpha);
        }
      }

      if (!this.dialogue) {
        setFont(ctx, 14);
        ctx.fillStyle = GREY;
        ctx.fillText("Arrows/WASD: move   Z: talk   C: menu   M: mute", 8, H - 20);
      }

      if (this.fade > 0) {
        ctx.fillStyle = rgb(0, 0, 0, Math.min(1, this.fade / 255));
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  // --- INTRO STATE ---
  const INTRO_SLIDES = [
    "Long ago, two peoples shared the valley:\nthe Lanternfolk and the Hollows.",
    "The Lanternfolk carried light.\nThe Hollows carried silence.",
    "When their quarrel grew too loud,\nthe great Bell of the valley was rung.",
    "Its echo sealed the Hollows\nbeneath Mount Verren.",
    "Legend says the Bell can ring only once more...",
    "...and whoever falls beneath the mountain\nmust find their own way back.",
  ];

  class IntroState extends State {
    constructor(game) {
      super(game);
      this.index = 0;
      this.writer = new Typewriter(INTRO_SLIDES[0], 28);
      this.fade = 255;
      this.t = 0.0;
      AUDIO.playMusic("cave");
    }

    drawScene(ctx, i) {
      ctx.fillStyle = NIGHT;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = WHITE;
      for (let k = 0; k < 40; k++) {
        const x = (k * 97) % W, y = (k * 53) % 220;
        const tw = 1 + Math.floor((Math.sin(this.t * 2 + k) + 1) * 0.6);
        ctx.fillRect(x, y, tw, tw);
      }
      fillCircle(ctx, 500, 90, 36, MOON);
      fillCircle(ctx, 514, 82, 30, NIGHT);
      fillPoly(ctx, [[0, 330], [140, 200], [260, 290], [380, 170], [520, 300], [W, 240], [W, 340], [0, 340]], RIDGE);
      ctx.fillStyle = rgb(18, 14, 36);
      ctx.fillRect(0, 330, W, 150);

      if (i >= 1) {
        const r = 14 + Math.sin(this.t * 4) * 2;
        fillCircle(ctx, 150, 310, r, YELLOW);
        fillCircle(ctx, 150, 310, r / 2, rgb(255, 255, 200));
      }
      if (i >= 2) drawBell(ctx, 320, 305, 1.0);
      if (i >= 3) fillEllipse(ctx, 440, 296, 90, 54, BLACK);
      if (i >= 5) {
        ctx.fillStyle = rgb(230, 120, 120);
        ctx.fillRect(470, 320, 14, 14);
      }
    }

    nextSlide() {
      this.index++;
      if (this.index >= INTRO_SLIDES.length) {
        this.game.changeState(new TitleState(this.game));
        return;
      }
      this.writer = new Typewriter(INTRO_SLIDES[this.index], 28);
      this.fade = 255;
    }

    handleKeyDown(e) {
      if (CONFIRM_CODES.has(e.code)) {
        if (this.writer.done) this.nextSlide();
        else this.writer.finish();
      } else if (SKIP_CODES.has(e.code)) {
        this.game.changeState(new TitleState(this.game));
      }
    }

    update(dt) {
      this.t += dt;
      this.writer.update(dt);
      this.fade = Math.max(0, this.fade - 400 * dt);
    }

    draw(ctx) {
      this.drawScene(ctx, this.index);
      ctx.fillStyle = BLACK;
      ctx.fillRect(40, 370, W - 80, 90);
      ctx.strokeStyle = WHITE;
      ctx.lineWidth = 3;
      ctx.strokeRect(40, 370, W - 80, 90);
      drawTyped(ctx, 20, this.writer.text, this.writer.shown, 60, 384, 26);
      if (this.writer.done && Math.floor(this.t * 2) % 2 === 0) {
        fillPoly(ctx, [[W - 80, 432], [W - 64, 432], [W - 72, 444]], YELLOW);
      }
      setFont(ctx, 14);
      ctx.fillStyle = GREY;
      ctx.fillText("Z / Enter / Space: next    X: skip    F11: fullscreen", 60, 442);
      if (this.fade > 0) {
        ctx.fillStyle = rgb(0, 0, 0, this.fade / 255);
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  class TitleState extends State {
    constructor(game) {
      super(game);
      this.t = 0.0;
      this.options = (game.hasSave() ? ["CONTINUE"] : []).concat(["NEW GAME", "ENDINGS"]);
      this.sel = 0;
      AUDIO.playMusic("title");
    }

    handleKeyDown(e) {
      const k = e.code;
      const g = this.game;
      if (UP_CODES.has(k)) {
        this.sel = (this.sel - 1 + this.options.length) % this.options.length;
        AUDIO.sfx("select");
      } else if (DOWN_CODES.has(k)) {
        this.sel = (this.sel + 1) % this.options.length;
        AUDIO.sfx("select");
      } else if (CONFIRM_CODES.has(k)) {
        AUDIO.sfx("confirm");
        const opt = this.options[this.sel];
        if (opt === "ENDINGS") {
          g.changeState(new GalleryState(g));
          return;
        }
        if (!(opt === "CONTINUE" && g.load())) {
          g.newGame();
        }
        g.changeState(new OverworldState(g));
      }
    }

    update(dt) { this.t += dt; }

    draw(ctx) {
      ctx.fillStyle = BLACK;
      ctx.fillRect(0, 0, W, H);
      const bob = Math.round(Math.sin(this.t * 2) * 5);
      drawCenteredText(ctx, "HOLLOWBELL", 54, W / 2, 130 + bob, BELL);
      drawBell(ctx, 320, 215, 0.9);
      this.options.forEach((opt, n) => {
        drawCenteredText(ctx, opt, 22, W / 2, 305 + n * 34, n === this.sel ? YELLOW : WHITE);
        if (n === this.sel) drawHeart(ctx, W / 2 - 90, 305 + n * 34, 7);
      });
      const seen = this.game.endings.size;
      drawCenteredText(ctx, `Endings found: ${seen}/${ENDING_ORDER.length}`, 16, W / 2, 430, GREY);
      drawCenteredText(ctx, "Z: select    F11: fullscreen    M: mute", 16, W / 2, 458, GREY);
    }
  }

    constructor(game, prompt, options, makers) {

        return;

      if (UP_CODES.has(k)) {
        this.sel = (this.sel - 1 + this.options.length) % this.options.length;

      } else if (DOWN_CODES.has(k)) {

        AUDIO.sfx("confirm");

      const pages = [...info.pages, `ENDING ${ENDING_ORDER.indexOf(kind) + 1} OF ${ENDING_ORDER.length}\n${info.title}`];
      this.dialogue = new DialogueBox(game.ctx, "", pages, "blip");

      game.shake(6, 0.5);

      game.recordEnding(kind);
      game.save();

    handleKeyDown(e) {
      if (CONFIRM_CODES.has(e.code)) {
        if (this.dialogue.advance()) {
          const g = this.game;
          const nxt = ENDINGS[this.kind].act === 2
            ? () => new FinalCardState(g, this.kind)
            : () => new TeaserState(g, this.kind);
          g.changeState(new CreditsState(g, nxt));

      this.t += dt;
      this.dialogue.update(dt);

      this.kit.x = x;

    rays(ctx, cx, cy, count = 14, length = 460) {
      for (let i = 0; i < count; i++) {

        drawLine(ctx, cx, cy, cx + Math.cos(ang) * length, cy + Math.sin(ang) * length, rgb(255, 240, 190), 2);

      for (let y = 0; y < H; y += 4) {

        ctx.fillStyle = rgb(
          top[0] + (bot[0] - top[0]) * f,
          top[1] + (bot[1] - top[1]) * f,
          top[2] + (bot[2] - top[2]) * f

  // =========================================================================
  // MAIN GAME CONTROLLER
  // =========================================================================
  class Game {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext("2d");
      this.SAVE_KEY = "hollowbell_save";
      this.META_KEY = "hollowbell_meta";

      this.shakeT = 0.0;
      this.shakeMag = 0;
      this.flashT = 0.0;
      this.flashDur = 0.1;
      this.flashColor = [255, 255, 255];

      this.endings = new Set();
      this.loadMeta();
      this.newGame();
      this.state = new IntroState(this);
    }

    newGame() {
      this.hp = this.max_hp = 20;
      this.lv = 1;
      this.exp = 0;
      this.gold = 0;
      this.items = ["Glow Berry", "Glow Berry"];
      this.weapon = "Twig";
      this.armor = "Wool Scarf";
      this.flags = {};
      this.kills = 0;
      this.spares = 0;
      this.room_key = "landing";
      this.spawn = [...ROOM_DATA.landing.spawn];
      this.defeated = new Set();
    }

    get atk() {
      return 2 * (this.lv - 1) + (ITEMS[this.weapon].atk || 0);
    }

    get defense() {
      return Math.floor((this.lv - 1) / 2) + (ITEMS[this.armor].def || 0);
    }

    expToNext() {
      return this.lv < EXP_TABLE.length ? EXP_TABLE[this.lv] - this.exp : 0;
    }

    gainExp(n) {
      this.exp += n;
      while (this.lv < EXP_TABLE.length && this.exp >= EXP_TABLE[this.lv]) {
        this.lv++;
        this.max_hp += 4;
        this.hp = Math.min(this.max_hp, this.hp + 4);
      }
    }

    useItem(i) {
      const name = this.items[i];
      const it = ITEMS[name];
      if (it.type === "heal") {
        this.items.splice(i, 1);
        const before = this.hp;
        this.hp = Math.min(this.max_hp, this.hp + it.amount);
        AUDIO.sfx("heal");
        return `You used the ${name}. Recovered ${this.hp - before} HP!`;
      }
      AUDIO.sfx("confirm");
      if (it.type === "weapon") {
        [this.items[i], this.weapon] = [this.weapon, name];
        return `You equipped the ${name}. ATK is now ${this.atk}.`;
      }
      [this.items[i], this.armor] = [this.armor, name];
      return `You equipped the ${name}. DEF is now ${this.defense}.`;
    }

    hasSave() {
      try { return !!localStorage.getItem(this.SAVE_KEY); }
      catch (e) { return false; }
    }

    save() {
      const data = {
        hp: this.hp, max_hp: this.max_hp, lv: this.lv, exp: this.exp, gold: this.gold,
        items: this.items, weapon: this.weapon, armor: this.armor, flags: this.flags,
        kills: this.kills, spares: this.spares, room_key: this.room_key,
        spawn: [...this.spawn], defeated: Array.from(this.defeated).sort()
      };
      try {
        localStorage.setItem(this.SAVE_KEY, JSON.stringify(data));
        return true;
      } catch (e) {
        return false;
      }
    }

    load() {
      try {
        const raw = localStorage.getItem(this.SAVE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        this.newGame();
        this.lv = clamp(parseInt(data.lv || 1, 10), 1, EXP_TABLE.length);
        this.max_hp = parseInt(data.max_hp || 20, 10);
        this.hp = Math.min(this.max_hp, parseInt(data.hp || this.max_hp, 10));
        this.exp = parseInt(data.exp || 0, 10);
        this.gold = parseInt(data.gold || 0, 10);
        this.items = (data.items || []).filter(n => n in ITEMS).slice(0, INVENTORY_MAX);
        this.weapon = (data.weapon in ITEMS) ? data.weapon : "Twig";
        this.armor = (data.armor in ITEMS) ? data.armor : "Wool Scarf";
        this.flags = { ...(data.flags || {}) };
        this.kills = parseInt(data.kills || 0, 10);
        this.spares = parseInt(data.spares || 0, 10);
        this.room_key = (data.room_key in ROOM_DATA) ? data.room_key : "landing";
        const sp = data.spawn || ROOM_DATA[this.room_key].spawn;
        this.spawn = [parseInt(sp[0], 10), parseInt(sp[1], 10)];
        this.defeated = new Set(data.defeated || []);
        return true;
      } catch (e) {
        return false;
      }
    }

    loadMeta() {
      try {
        const raw = localStorage.getItem(this.META_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        this.endings = new Set((data.endings || []).filter(k => k in ENDINGS));
      } catch (e) {
        this.endings = new Set();
      }
    }

    recordEnding(kind) {
      this.endings.add(kind);
      try {
        localStorage.setItem(this.META_KEY, JSON.stringify({ endings: Array.from(this.endings).sort() }));
      } catch (e) {}
    }

    shake(mag, dur) { this.shakeMag = mag; this.shakeT = dur; }
    flash(color, dur) { this.flashColor = color; this.flashT = dur; this.flashDur = dur; }
    changeState(newState) { this.state = newState; }

    step(dt) {
      AUDIO.update(dt);
      this.shakeT = Math.max(0.0, this.shakeT - dt);
      this.flashT = Math.max(0.0, this.flashT - dt);
      this.state.update(dt);

      const ctx = this.ctx;
      ctx.save();
      if (this.shakeT > 0) {
        const m = Math.max(1, Math.round(this.shakeMag * Math.min(1.0, this.shakeT / 0.2)));
        const ox = Math.floor(randRange(-m, m + 1));
        const oy = Math.floor(randRange(-m, m + 1));
        ctx.fillStyle = BLACK;
        ctx.fillRect(0, 0, W, H);
        ctx.translate(ox, oy);
      }
      this.state.draw(ctx);
      if (this.flashT > 0) {
        const alpha = (150 * this.flashT / this.flashDur) / 255;
        ctx.fillStyle = rgb(...this.flashColor, alpha);
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }
  }

  // =========================================================================
  // BOOTSTRAP, INPUT BINDINGS, FULLSCREEN & TOUCH
  // =========================================================================
  window.addEventListener("load", () => {
    const canvas = document.getElementById("game");
    const game = new Game(canvas);

    function toggleFullscreen() {
      const wrap = document.getElementById("stage-wrap");
      if (!document.fullscreenElement) {
        (wrap.requestFullscreen || canvas.requestFullscreen).call(wrap).catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.getElementById("btn-mute").addEventListener("click", () => {
      AUDIO.unlock();
      AUDIO.toggleMute();
    });

    document.getElementById("btn-fs").addEventListener("click", () => {
      AUDIO.unlock();
      toggleFullscreen();
    });

    window.addEventListener("keydown", (e) => {
      AUDIO.unlock();
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Tab"].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === "KeyM") {
        AUDIO.toggleMute();
        return;
      }
      if (e.code === "F11" || ((e.code === "Enter" || e.code === "NumpadEnter") && e.altKey)) {
        e.preventDefault();
        toggleFullscreen();
        return;
      }
      if (!e.repeat) {
        keysDown.add(e.code);
        game.state.handleKeyDown(e);
      }
    });

    window.addEventListener("keyup", (e) => {
      keysDown.delete(e.code);
    });

    window.addEventListener("blur", () => keysDown.clear());
    canvas.addEventListener("pointerdown", () => AUDIO.unlock());

    // Mobile Touch D-Pad & Action Buttons
    document.querySelectorAll(".tbtn").forEach(btn => {
      const code = btn.dataset.key;
      const press = (ev) => {
        ev.preventDefault();
        AUDIO.unlock();
        btn.classList.add("pressed");
        if (!keysDown.has(code)) {
          keysDown.add(code);
          game.state.handleKeyDown({ code, altKey: false, repeat: false });
        }
      };
      const release = (ev) => {
        ev.preventDefault();
        btn.classList.remove("pressed");
        keysDown.delete(code);
      };
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("pointercancel", release);
    });

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000.0, 0.05);
      lastTime = now;
      game.step(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
